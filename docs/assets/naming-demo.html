<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测名 · 赐名怪物秘语体系 Demo</title>
<style>
:root{
  --bg:#08090b;
  --panel:#12141a;
  --panel2:#171a21;
  --line:#252a33;
  --line2:#333a46;
  --ink:#e6e4df;
  --ink2:#a2a8b2;
  --ink3:#666d78;
  --gold:#c9a86a;
  --gold2:#e6cf9a;
  --law:#7ea6c8;
  --chaos:#a8544f;
  --ok:#7fae7a;
  --bad:#c05a52;
  --wild:#9b7fc4;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:
    radial-gradient(1100px 640px at 12% -12%, #161920 0%, rgba(0,0,0,0) 62%),
    radial-gradient(820px 560px at 108% 112%, #171019 0%, rgba(0,0,0,0) 58%),
    var(--bg);
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:14px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:26px 20px 60px}

/* ---------- top ---------- */
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
.brand h1{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.16em;color:var(--ink)}
.brand p{font-size:11.5px;color:var(--ink3);letter-spacing:.26em;margin-top:2px}
.spacer{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--ink3);font:inherit;font-size:12px;
  padding:5px 12px;border-radius:2px;cursor:pointer;letter-spacing:.08em;transition:.16s}
.tab:hover{border-color:var(--line2);color:var(--ink2)}
.tab.on{border-color:var(--gold);color:var(--gold2);background:rgba(201,168,106,.07)}
.tab.done{border-color:var(--ok);color:var(--ok)}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}

.card{background:linear-gradient(180deg,var(--panel) 0%,#0d0f12 100%);
  border:1px solid var(--line);border-radius:3px;padding:18px 18px 20px;position:relative}
.card+.card{margin-top:16px}
.card h2{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.2em;color:var(--ink2);
  display:flex;align-items:center;gap:9px;margin-bottom:14px}
.card h2:before{content:"";width:3px;height:13px;background:var(--gold);opacity:.75;display:block}
.card h2 .tail{margin-left:auto;font-family:inherit;font-size:11px;letter-spacing:.1em;color:var(--ink3);font-weight:400}

/* ---------- monster ---------- */
.mhead{display:flex;gap:15px;align-items:center;margin-bottom:12px}
.sigil{width:74px;height:74px;flex:0 0 74px;border:1px solid var(--line2);border-radius:2px;
  display:flex;align-items:center;justify-content:center;background:#0c0e12;position:relative;overflow:hidden}
.sigil .ring{position:absolute;inset:9px;border:1px solid rgba(201,168,106,.22);border-radius:50%}
.sigil .ring.b{inset:18px;border-color:rgba(201,168,106,.12)}
.sigil .marks{position:relative;display:flex;gap:4px;font-family:var(--serif);font-size:15px;color:var(--gold2)}
.sigil .marks i{font-style:normal;opacity:.88}
.sigil .marks .blank{color:var(--ink3);opacity:.45;font-size:12px}
.mname{font-family:var(--serif);font-size:19px;letter-spacing:.1em}
.mmeta{font-size:11.5px;color:var(--ink3);letter-spacing:.12em;margin-top:3px}
.mdesc{font-size:13px;color:var(--ink2);border-left:2px solid var(--line2);padding-left:11px;margin:10px 0 4px}
.mstate{font-size:12.5px;color:var(--gold2);opacity:.85;margin-top:8px;font-style:italic}

.rankrow{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.rankrow>span{font-size:11px;letter-spacing:.2em;color:var(--ink3)}
.rank{display:flex;gap:4px}
.rank i{width:22px;height:6px;background:#20242c;border:1px solid var(--line);display:block;border-radius:1px}
.rank i.on{background:var(--chaos);border-color:var(--chaos);box-shadow:0 0 8px rgba(168,84,79,.5)}

.clues{list-style:none;display:flex;flex-direction:column;gap:8px}
.clues li{font-size:13px;color:var(--ink2);background:#0f1116;border:1px solid var(--line);
  border-left:2px solid var(--line2);padding:9px 12px;border-radius:2px}
.clues li.new{border-left-color:var(--gold);animation:fadein .5s ease}
.clues li b{color:var(--ink3);font-weight:400;font-size:11px;margin-right:8px;letter-spacing:.1em}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.hint-locked{font-size:12px;color:var(--ink3);text-align:center;padding:9px;border:1px dashed var(--line);border-radius:2px;list-style:none}

/* ---------- desk ---------- */
.compose{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
.cslot{flex:1;min-width:0;border:1px solid var(--line2);background:#0c0e12;border-radius:2px;
  padding:9px 3px;text-align:center;position:relative;transition:.18s}
.cslot .k{font-size:9.5px;letter-spacing:.1em;color:var(--ink3);display:block}
.cslot .v{font-family:var(--serif);font-size:20px;color:var(--ink3);display:block;line-height:1.35;margin-top:2px}
.cslot .v.g2{font-size:15px}
.cslot.filled .v{color:var(--ink)}
.cslot.ok{border-color:var(--ok);background:rgba(127,174,122,.07)}
.cslot.ok .v{color:var(--ok)}
.cslot.wild .v{color:var(--wild)}
.cslot.bad{border-color:var(--bad);background:rgba(192,90,82,.07)}
.cslot.bad .v{color:var(--bad)}
.cslot small{position:absolute;top:-8px;right:4px;font-size:9px;letter-spacing:.06em;color:var(--ok);background:#0d0f12;padding:0 3px}

.progwrap{margin:16px 0 4px}
.progtop{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;color:var(--ink3);margin-bottom:6px}
.progtop b{color:var(--gold2);font-weight:400}
.bar{height:5px;background:#1a1e25;border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a7040,var(--gold2));transition:width .45s ease}

.prow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:none}
.plabel{flex:0 0 108px;padding-top:3px}
.plabel b{display:block;font-family:var(--serif);font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:.08em}
.plabel span{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{background:#0e1015;border:1px solid var(--line);border-radius:2px;cursor:pointer;font:inherit;
  padding:6px 10px 5px;display:flex;flex-direction:column;align-items:center;min-width:50px;transition:.15s}
.chip .g{font-family:var(--serif);font-size:19px;color:var(--ink2);line-height:1.2}
.chip .g.g2{font-size:14px}
.chip .s{font-size:9.5px;color:var(--ink3);letter-spacing:.08em}
.chip:hover{border-color:var(--line2);background:#141720}
.chip.on{border-color:var(--gold);background:rgba(201,168,106,.1)}
.chip.on .g{color:var(--gold2)}
.chip.wild .g{color:var(--wild)}
.chip.wild.on{border-color:var(--wild);background:rgba(155,127,196,.1)}
.chip.dis{opacity:.32;cursor:not-allowed}
.prow.locked{opacity:.62}
.prow.locked .chips{pointer-events:none}
.prow.locked .chip.on{border-color:var(--ok);background:rgba(127,174,122,.1)}
.prow.locked .chip.on .g{color:var(--ok)}

.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;letter-spacing:.12em;padding:10px 20px;border-radius:2px;cursor:pointer;
  border:1px solid var(--line2);background:transparent;color:var(--ink2);transition:.16s}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.primary{border-color:var(--gold);color:#0b0c0e;background:linear-gradient(180deg,var(--gold2),var(--gold));
  font-weight:600;letter-spacing:.18em}
.btn.primary:hover{box-shadow:0 0 18px rgba(201,168,106,.3);color:#000}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:6px 13px;font-size:12px;letter-spacing:.08em}

.loglist{list-style:none;display:flex;flex-direction:column;gap:7px;max-height:240px;overflow:auto}
.loglist li{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2);
  background:#0f1116;border:1px solid var(--line);padding:7px 10px;border-radius:2px}
.loglist li .no{color:var(--ink3);font-size:10.5px;letter-spacing:.06em;flex:0 0 44px}
.loglist li .cells{display:flex;gap:5px;flex-wrap:wrap}
.loglist li .cells b{font-family:var(--serif);font-weight:400;font-size:12.5px;padding:1px 6px;border:1px solid var(--line2);border-radius:2px;color:var(--ink2)}
.loglist li .cells b.ok{border-color:var(--ok);color:var(--ok)}
.loglist li .cells b.bad{border-color:var(--bad);color:var(--bad)}
.loglist li .cells b.wild{border-color:var(--wild);color:var(--wild)}
.loglist li .tag{margin-left:auto;font-size:10.5px;letter-spacing:.06em;color:var(--ink3)}
.emptyli{font-size:12px;color:var(--ink3);text-align:center;padding:14px;border-style:dashed!important}

.rev .line{font-size:14.5px;font-family:var(--serif);line-height:2.1;color:var(--ink2);
  padding:11px 14px;border:1px solid var(--line);border-left:2px solid var(--line2);background:#0f1116;
  border-radius:2px;margin-bottom:9px}
.rev .line em{font-style:normal;color:var(--gold2);border-bottom:1px dashed rgba(201,168,106,.5);padding:0 2px}
.rev .line .sn{font-size:10.5px;color:var(--ink3);letter-spacing:.14em;margin-right:9px;font-family:"Microsoft YaHei",sans-serif}

.anchors{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.anchor-btn{font-family:var(--serif);font-size:17px;letter-spacing:.16em;padding:15px 8px;border-radius:2px;
  border:1px solid var(--line2);background:#0e1015;color:var(--ink2);cursor:pointer;transition:.16s}
.anchor-btn:hover{border-color:var(--gold);color:var(--gold2);background:rgba(201,168,106,.07)}
.anchor-btn.gone{opacity:.22;text-decoration:line-through;cursor:not-allowed}
.anchor-note{font-size:12px;color:var(--ink3);margin-top:12px;line-height:1.7}

.ov{position:fixed;inset:0;background:rgba(4,5,7,.86);backdrop-filter:blur(4px);z-index:60;
  display:none;align-items:center;justify-content:center;padding:22px}
.ov.on{display:flex}
.modal{background:linear-gradient(180deg,#14171e,#0d0f13);border:1px solid var(--line2);border-radius:3px;
  max-width:780px;width:100%;max-height:86vh;overflow:auto;padding:26px 26px 28px;position:relative}
.modal h3{font-family:var(--serif);font-size:17px;letter-spacing:.16em;font-weight:600;margin-bottom:4px}
.modal .sub{font-size:11px;letter-spacing:.2em;color:var(--ink3);margin-bottom:16px}
.modal .close{position:absolute;top:14px;right:16px;background:none;border:1px solid var(--line);
  color:var(--ink3);font:inherit;font-size:12px;padding:3px 10px;border-radius:2px;cursor:pointer}
.modal .close:hover{color:var(--ink);border-color:var(--line2)}
.sec{margin-top:18px}
.sec h4{font-size:12.5px;letter-spacing:.16em;color:var(--gold);font-weight:600;margin-bottom:9px;font-family:var(--serif)}
.sec p{font-size:13px;color:var(--ink2);margin-bottom:7px}
.sec ol,.sec ul{margin-left:18px;font-size:13px;color:var(--ink2)}
.sec li{margin-bottom:5px}
table.cx{width:100%;border-collapse:collapse;font-size:12.5px}
table.cx th,table.cx td{border:1px solid var(--line);padding:7px 10px;text-align:left;color:var(--ink2);vertical-align:top}
table.cx th{background:#171a21;color:var(--ink3);font-weight:400;letter-spacing:.1em;font-size:11px}
table.cx td b{font-family:var(--serif);font-size:15px;color:var(--gold2);font-weight:400;margin-right:8px}
table.cx tr.g2 td b{color:var(--ink);font-size:13.5px}

.endwrap{text-align:center;padding:6px 0 4px}
.endwrap .lab{font-size:11px;letter-spacing:.4em;color:var(--ink3)}
.endwrap .verdict{font-family:var(--serif);font-size:28px;letter-spacing:.26em;margin:12px 0 6px}
.endwrap.win .verdict{color:var(--gold2)}
.endwrap.lose .verdict{color:var(--chaos)}
.endwrap .truename{font-family:var(--serif);font-size:46px;letter-spacing:.3em;color:var(--gold2);
  margin:14px 0 6px;text-shadow:0 0 26px rgba(201,168,106,.35)}
.endwrap .seal{display:flex;gap:6px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.endwrap .seal b{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--ink);border:1px solid var(--line2);padding:4px 12px;border-radius:2px}
.endwrap .txt{font-size:13px;color:var(--ink2);max-width:580px;margin:14px auto 0;text-align:left}
.endwrap .txt p{margin-bottom:8px;font-family:var(--serif);line-height:2}
.endwrap .acts{justify-content:center}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1b1f27;border:1px solid var(--line2);
  color:var(--ink2);font-size:12.5px;padding:9px 18px;border-radius:2px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1;bottom:44px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <h1>测 名</h1>
      <p>赐名怪物 · 秘语匹配体系 DEMO</p>
    </div>
    <div class="spacer"></div>
    <div class="tabs" id="tabs"></div>
    <button class="tab" id="btnCodex" type="button">秘语图鉴</button>
    <button class="tab" id="btnRules" type="button">规则</button>
  </div>

  <div class="grid">

    <!-- ============ 左：怪物档案 ============ -->
    <div>
      <div class="card">
        <h2>观察对象<span class="tail" id="objId">OBJ — 001</span></h2>
        <div class="mhead">
          <div class="sigil">
            <span class="ring"></span><span class="ring b"></span>
            <span class="marks" id="sigil"></span>
          </div>
          <div>
            <div class="mname" id="mName">未命之物</div>
            <div class="mmeta" id="mMeta">观测记录 · 未归档</div>
          </div>
        </div>
        <div class="mdesc" id="mDesc"></div>
        <div class="mstate" id="mState"></div>
        <div class="rankrow">
          <span>阶 级</span>
          <div class="rank" id="rank"><i></i><i></i><i></i><i></i><i></i></div>
          <span id="rankTxt" style="letter-spacing:.08em"></span>
        </div>
      </div>

      <div class="card">
        <h2>观测线索<span class="tail" id="clueCount"></span></h2>
        <ul class="clues" id="clues"></ul>
      </div>

      <div class="card" id="revCard" style="display:none">
        <h2>四段式真名 · 揭秘<span class="tail">四句 · 其中一句揭示赐名</span></h2>
        <div class="rev" id="rev"></div>
      </div>

      <div class="card">
        <h2>测名记录<span class="tail" id="logCount"></span></h2>
        <ul class="loglist" id="log"></ul>
      </div>
    </div>

    <!-- ============ 右：测名台 ============ -->
    <div>
      <div class="card">
        <h2>测名台<span class="tail">四段式真名</span></h2>
        <div class="compose" id="compose"></div>

        <div class="progwrap">
          <div class="progtop"><span>测名进度</span><span><b id="progTxt">0%</b></span></div>
          <div class="bar"><span id="progBar"></span></div>
        </div>

        <div id="pools" style="margin-top:14px"></div>

        <div class="acts" id="acts">
          <button class="btn primary" id="btnRecite" type="button">宣 读 测 名</button>
          <button class="btn" id="btnClear" type="button">清空落位</button>
          <button class="btn" id="btnReset" type="button">重新观测</button>
        </div>
      </div>

      <div class="card" id="anchorCard" style="display:none">
        <h2>锚定赐名<span class="tail">四个词里只有一个真名</span></h2>
        <div class="anchors" id="anchors"></div>
        <div class="anchor-note">
          四段秘语已锁死，四句也读到了。但真名只有一个——
          它出现在<strong style="color:#e6cf9a;font-weight:400">被「宣告」出来的那一句</strong>里：那句会说出别人怎么称呼它。
        </div>
      </div>
    </div>

  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   秘语体系数据（照表格：14 秘语 / 4 组）
   ============================================================ */
var GROUP_ORDER = ['a', 'b', 'c', 'd'];
var GLABEL = { a:'一 · 倾向', b:'二 · 性', c:'三 · 途', d:'四 · 显' };
var GDESC = { a:'L N C 倾向', b:'主动 / 受控', c:'手段', d:'表现属性' };

var SECRETS = {
  a: [
    { v:'L', s:'秩序', d:'即 LAW。该秘语表达概念为对他者友善。' },
    { v:'N', s:'中立', d:'即 NEUTRAL。该秘语表达概念为无视或忽视。' },
    { v:'C', s:'混乱', d:'即 CHAOS。该秘语表达概念为对他者恶意。' }
  ],
  b: [
    { v:'一神', s:'受控', d:'一神教倾向。无主动性，被他者控制或驱使。' },
    { v:'多神', s:'主动', d:'多神论倾向。存在主动性，为了存活主动进行抉择。' }
  ],
  c: [
    { v:'战', s:'战士', d:'高防御性能、物理战斗方式等符合战士刻板印象的能力表现。' },
    { v:'法', s:'法师', d:'操控能量、高智能等符合法师刻板印象的能力表现。' },
    { v:'牧', s:'牧师', d:'治愈、圣化等符合牧师刻板印象的能力表现。' }
  ],
  d: [
    { v:'火', s:'焰', d:'以火焰、热能、辐射等方式体现力量。' },
    { v:'水', s:'寂', d:'以类似冰或死寂的方式体现力量。' },
    { v:'电', s:'雷', d:'以类似雷电的方式体现力量。' },
    { v:'气', s:'冲', d:'以冲击、塑形等方式体现力量。' },
    { v:'祝', s:'圣', d:'以神圣化、正能量方式体现力量。' },
    { v:'咒', s:'秽', d:'以怨咒、劣化等负能量方式体现力量。' }
  ]
};

var WILD = '無相';
var WILD_LIMIT = 3;
var MAX_MISTAKE = 5;

var RANK_STATE = [
  '它静止着，没有看你。',
  '它转过来了。它开始注意你。',
  '它的轮廓在不稳定地抖动——它正在重写自己。',
  '它发出低鸣。你知道它已经记住了你的声音。',
  '它正在向深处退去。再错一次，它就永远消失了。'
];

/* ---------------- 怪物（隐藏答案 + 四段式真名） ---------------- */
var MONSTERS = [
  {
    id: '001',
    title: '灰烬中的某物',
    desc: '一具半塌的躯壳，表面覆着冷却的壳，壳缝里有暗红的光一直闷着。',
    ans: { a:'L', b:'多神', c:'牧', d:'火' },
    name: '守烬',
    clues: [
      '它对靠近的活物没有敌意。有人用铁棍砸它，它只是退开半步，等那人走远。',
      '它的壳是凉的，可壳缝里一直有暗红的光在闷着，从没有熄过。',
      '没有人召唤它。它出现的时辰，是它自己挑的。',
      '它把手按在伤口上，血止住了，断掉的骨头在里面接了回去。',
      '它经过的木头会炭化，石头会开裂；可它一碰到水就剧烈收缩，像是被烫到。',
      '它从不猎食。它只是等——等有人受伤，然后走过去。'
    ],
    lines: [

/* ============================================================
   状态与工具
   ============================================================ */
var S = null;
var cleared = {};

function freshState(mi) {
  return {
    mi: mi,
    m: MONSTERS[mi],
    mistakes: 0,
    pick: { a:null, b:null, c:null, d:null },
    locked: { a:false, b:false, c:false, d:false },
    wildLeft: WILD_LIMIT,
    phase: 'test',
    last: null,
    log: [],
    revealed: false,
    anchorGone: []
  };
}

function $(id) { return document.getElementById(id); }
function esc(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function isG2(v) { return (v === 'L' || v === 'N' || v === 'C') ? '' : ' g2'; }
function lockedCount() {
  var n = 0;
  for (var i = 0; i < GROUP_ORDER.length; i++) if (S.locked[GROUP_ORDER[i]]) n++;
  return n;
}

var toastTimer = null;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast on';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'toast'; }, 1700);
}

/* ============================================================
   渲染
   ============================================================ */
function renderTabs() {
  var h = '';
  for (var i = 0; i < MONSTERS.length; i++) {
    var cls = 'tab';
    if (i === S.mi) cls += ' on';
    if (cleared[i]) cls += ' done';
    h += '<button type="button" class="' + cls + '" data-mi="' + i + '">'
       + MONSTERS[i].id + ' ' + esc(MONSTERS[i].title) + '</button>';
  }
  $('tabs').innerHTML = h;
}

function renderMonster() {
  var m = S.m;
  $('objId').textContent = 'OBJ — ' + m.id;
  $('mName').textContent = m.title;
  $('mMeta').textContent = '观测记录 · ' + (cleared[S.mi] ? '已归档 · 赐名成立' : '未归档');
  $('mDesc').textContent = m.desc;

  var rankIdx = Math.min(S.mistakes, MAX_MISTAKE - 1);
  if (S.phase === 'anchor') $('mState').textContent = '四段秘语已锁死。它在等你说出那个名字。';
  else if (S.phase === 'done') $('mState').textContent = '';
  else $('mState').textContent = RANK_STATE[rankIdx];

  var rh = '';
  var filled = Math.min(S.mistakes + 1, MAX_MISTAKE);
  for (var i = 0; i < MAX_MISTAKE; i++) {
    rh += '<i class="' + (i < filled ? 'on' : '') + '"></i>';
  }
  $('rank').innerHTML = rh;

  var rt = $('rankTxt');
  if (S.phase !== 'test') rt.textContent = '';
  else if (S.mistakes === 0) rt.textContent = '· 尚可失误 ' + (MAX_MISTAKE - 1) + ' 次';
  else rt.textContent = '· 再失误 ' + (MAX_MISTAKE - S.mistakes - 1) + ' 次即脱锚';

  if (S.revealed) {
    $('sigil').innerHTML = '<i>' + m.ans.a + '</i><i>' + m.ans.b + '</i><i>' + m.ans.c + '</i><i>' + m.ans.d + '</i>';
  } else {
    $('sigil').innerHTML = '<span class="blank">▨</span><span class="blank">▨</span><span class="blank">▨</span><span class="blank">▨</span>';
  }
}

function renderClues() {
  var total = S.m.clues.length;
  var show = Math.min(2 + S.mistakes, total);
  var h = '';
  for (var i = 0; i < total; i++) {
    if (i >= show) {
      h += '<li class="hint-locked">［ 未解析 · 阶级 ' + i + ' 时暴露 ］</li>';
      continue;
    }
    var isNew = (i === show - 1 && S.mistakes > 0 && S.phase === 'test');
    h += '<li class="' + (isNew ? 'new' : '') + '"><b>0' + (i + 1) + '</b>' + esc(S.m.clues[i]) + '</li>';
  }
  $('clues').innerHTML = h;
  $('clueCount').textContent = '已解析 ' + show + ' / ' + total;
}

function renderCompose() {
  var h = '';
  for (var i = 0; i < GROUP_ORDER.length; i++) {
    var g = GROUP_ORDER[i];
    var v = S.locked[g] ? S.m.ans[g] : S.pick[g];
    var cls = '';
    if (S.locked[g]) cls = ' ok';
    else if (v === WILD) cls = ' filled wild';
    else if (v) cls = ' filled';
    if (!S.locked[g] && S.last && S.last[g] === 'bad') cls += ' bad';
    var mark = S.locked[g] ? '<small>已锚定</small>' : '';
    h += '<div class="cslot' + cls + '">' + mark
       + '<span class="k">' + GLABEL[g] + '</span>'
       + '<span class="v' + (v ? isG2(v) : '') + '">' + (v ? esc(v) : '？') + '</span></div>';
  }
  $('compose').innerHTML = h;

  var pct = Math.round(lockedCount() / 4 * 100);
  $('progBar').style.width = pct + '%';
  $('progTxt').textContent = pct + '%';
}

function renderPools() {
  var h = '';
  for (var i = 0; i < GROUP_ORDER.length; i++) {
    var g = GROUP_ORDER[i];
    var list = SECRETS[g];
    var locked = S.locked[g];
    h += '<div class="prow' + (locked ? ' locked' : '') + '" data-slot="' + g + '">';
    h += '<div class="plabel"><b>' + GLABEL[g] + '</b><span>' + GDESC[g] + '</span></div>';
    h += '<div class="chips">';
    for (var j = 0; j < list.length; j++) {
      var it = list[j];
      var on = (S.pick[g] === it.v) ? ' on' : '';
      h += '<button type="button" class="chip' + on + '" data-slot="' + g + '" data-val="' + esc(it.v) + '">'
         + '<span class="g' + isG2(it.v) + '">' + esc(it.v) + '</span>'
         + '<span class="s">' + esc(it.s) + '</span></button>';
    }
    var won = (S.pick[g] === WILD) ? ' on' : '';
    var wdis = (S.wildLeft <= 0) ? ' dis' : '';
    h += '<button type="button" class="chip wild' + won + wdis + '" data-slot="' + g + '" data-val="' + WILD + '">'
       + '<span class="g g2">無相</span><span class="s">剩 ' + S.wildLeft + '</span></button>';
    h += '</div></div>';
  }
  $('pools').innerHTML = h;
}

function renderLog() {
  if (S.log.length === 0) {
    $('log').innerHTML = '<li class="emptyli">还没有宣读记录。</li>';
    $('logCount').textContent = '';
    return;
  }
  var h = '';
  for (var i = 0; i < S.log.length; i++) {
    var e = S.log[i];
    h += '<li><span class="no">第 ' + (S.log.length - i) + ' 次</span><span class="cells">';
    for (var j = 0; j < GROUP_ORDER.length; j++) {
      var g = GROUP_ORDER[j];
      var st = e.res[g];
      var suf = (st === 'ok') ? ' ✓' : (st === 'bad' ? ' ✕' : ' ~');
      h += '<b class="' + st + '">' + esc(e.pick[g]) + suf + '</b>';
    }
    h += '</span><span class="tag">' + (e.mistake ? '秘语不匹配' : '秘语全部匹配') + '</span></li>';
  }
  $('log').innerHTML = h;
  $('logCount').textContent = '共 ' + S.log.length + ' 次';
}

function renderReveal() {
  if (!S.revealed) { $('revCard').style.display = 'none'; return; }
  $('revCard').style.display = '';
  var h = '';
  for (var i = 0; i < S.m.lines.length; i++) {
    var ln = S.m.lines[i];
    var t = esc(ln.text).split(esc(ln.anchor)).join('<em>' + esc(ln.anchor) + '</em>');
    h += '<div class="line"><span class="sn">第 ' + (i + 1) + ' 句</span>' + t + '</div>';
  }
  $('rev').innerHTML = h;
}

function renderAnchors() {
  if (S.phase !== 'anchor') { $('anchorCard').style.display = 'none'; return; }
  $('anchorCard').style.display = '';
  var h = '';
  for (var i = 0; i < S.m.lines.length; i++) {
    var w = S.m.lines[i].anchor;
    var gone = false;
    for (var j = 0; j < S.anchorGone.length; j++) if (S.anchorGone[j] === w) gone = true;
    h += '<button type="button" class="anchor-btn' + (gone ? ' gone' : '') + '" data-w="' + esc(w) + '">' + esc(w) + '</button>';
  }
  $('anchors').innerHTML = h;
}

function renderActs() {
  var btn = $('btnRecite');
  if (S.phase !== 'test') {
    btn.disabled = true;
    btn.textContent = '秘 语 已 锁 死';
    return;
  }
  btn.disabled = false;
  btn.textContent = '宣 读 测 名';
}

function renderAll() {
  renderTabs(); renderMonster(); renderClues(); renderCompose();
  renderPools(); renderLog(); renderReveal(); renderAnchors(); renderActs();
}

/* ============================================================
   核心流程
   ============================================================ */
function startMonster(mi) {
  S = freshState(mi);
  renderAll();
}

function onPoolClick(ev) {
  if (S.phase !== 'test') return;
  var el = ev.target;
  while (el && el !== document.body && !el.getAttribute('data-val')) el = el.parentNode;
  if (!el || el === document.body) return;
  var g = el.getAttribute('data-slot');
  var v = el.getAttribute('data-val');
  if (!g || !v) return;
  if (S.locked[g]) return;
  if (v === WILD && S.wildLeft <= 0) { toast('無相已经用尽了。'); return; }
  S.pick[g] = (S.pick[g] === v) ? null : v;
  S.last = null;
  renderPools(); renderCompose();
}

function doRecite() {
  if (S.phase !== 'test') return;
  for (var i = 0; i < GROUP_ORDER.length; i++) {
    var g = GROUP_ORDER[i];
    if (!S.pick[g]) { toast('还有秘语没有落位。'); return; }
  }

  var res = {};
  var mistake = false;
  var usedWild = false;
  var newlyLocked = 0;

  for (var j = 0; j < GROUP_ORDER.length; j++) {
    var g2 = GROUP_ORDER[j];
    var v = S.pick[g2];
    if (v === WILD) { res[g2] = 'wild'; usedWild = true; }
    else if (v === S.m.ans[g2]) { res[g2] = 'ok'; S.locked[g2] = true; newlyLocked++; }
    else { res[g2] = 'bad'; mistake = true; }
  }

  if (usedWild) S.wildLeft = Math.max(0, S.wildLeft - 1);

  S.last = res;
  S.log.unshift({ res: res, pick: { a:S.pick.a, b:S.pick.b, c:S.pick.c, d:S.pick.d }, mistake: mistake });

  if (mistake) S.mistakes++;

  if (lockedCount() === 4) {
    S.phase = 'anchor';
    S.revealed = true;
    renderAll();
    toast('四段秘语全部匹配 · 测名进度 100%');
    return;
  }

  if (S.mistakes >= MAX_MISTAKE) {
    S.phase = 'done';
    renderAll();
    showEnd(false);
    return;
  }

  renderAll();
  if (mistake) toast('秘语不匹配 · 它升到了 ' + (S.mistakes + 1) + ' 阶');
  else if (newlyLocked > 0) toast('有秘语落对了 · 已锚定');
}

function clearPicks() {
  if (S.phase !== 'test') return;
  S.pick = { a:null, b:null, c:null, d:null };
  S.last = null;
  for (var i = 0; i < GROUP_ORDER.length; i++) {
    if (!S.locked[GROUP_ORDER[i]]) S.pick[GROUP_ORDER[i]] = null;
  }
  renderPools(); renderCompose();
}

function doAnchor(w) {
  if (S.phase !== 'anchor') return;
  for (var k = 0; k < S.anchorGone.length; k++) if (S.anchorGone[k] === w) return;
  if (w === S.m.name) {
    cleared[S.mi] = true;
    S.phase = 'done';
    renderAll();
    showEnd(true);
    return;
  }
  S.anchorGone.push(w);
  S.mistakes++;
  if (S.mistakes >= MAX_MISTAKE) {
    S.phase = 'done';
    renderAll();
    showEnd(false);
    return;
  }
  renderAll();
  toast('「' + w + '」不是它的名字 · 它把自己重新裹了起来');
}

     + '<p>赐名具体步骤：<strong style="color:#e6cf9a;font-weight:400">观察对象 → 匹配秘语 → 揭秘获得四段式真名 → 锚定具体赐名</strong></p>'

     + '<p><b style="color:#a2a8b2">写作规范：</b>四段式真名书写时需有四段包含秘语要素的短句，并在其中一句揭示真名（赐名）。</p>'
     + '<p><b style="color:#a2a8b2">应用：</b>匹配秘语时，如果秘语正确（是四个秘语之一）会增加测名进度；只有全部秘语匹配并顺序正确，才会将测名进度推进至 100%。</p></div>';

  h += '<div class="sec"><h4>DEMO 里怎么玩</h4><ol>'
     + '<li><b>观察</b>：左侧线索逐条暴露。初始 2 条，每次失误 +1 条，最多 6 条。</li>'
     + '<li><b>匹配秘语</b>：在右侧四组里各选一个秘语，落入四段式真名的四位。</li>'
     + '<li><b>宣读测名</b>：逐位判定。<span style="color:#7fae7a">正确</span>的位会被锁死（不可再改），进度 +25%。</li>'
     + '<li><b>阶级</b>：任何一位错 → 阶级 +1。阶级 5 时再失误，它脱锚逃走，本局失败。</li>'
     + '<li><b>揭秘</b>：四位全部锁死 → 进度 100%，四段短句揭示。</li>'
     + '<li><b>锚定赐名</b>：四句里各有一个候选词，只有出现在「宣告句」里的那个才是真名。锚错同样计入阶级。</li>'
     + '</ol></div>';

  h += '<div class="sec"><h4>参考：Warframe 赤毒玄骸 / 安魂秘语</h4><ul>'
     + '<li><b>对应密码位</b>：安魂秘语的三个槽位 → 这里四段式真名的四位。</li>'
     + '<li><b>部分正确即涨进度</b>：安魂序列部分命中会给进度 → 这里锁死正确位并 +25%。</li>'
     + '<li><b>错误惩罚</b>：玄骸升级、变强 → 这里阶级上升、线索变多。</li>'
     + '<li><b>万能符 Oull</b>：→ 这里的「<span style="color:#9b7fc4">無相</span>」，可填任意一位、不判错，但也不锁位、不涨进度，共 3 次。</li>'
     + '<li><b>差异</b>：玄骸是逐步试出顺序；本体系四位分属四组、互不串位，真正的难点在「<b>观察</b>」与最后「<b>锚定真名</b>」。</li>'
     + '</ul></div>';
  openModal(h);
}

/* ============================================================
   绑定
   ============================================================ */
$('pools').addEventListener('click', onPoolClick);
$('tabs').addEventListener('click', function (ev) {
  var el = ev.target;
  while (el && el !== document.body && el.getAttribute('data-mi') === null) el = el.parentNode;
  if (!el || el === document.body) return;
  startMonster(parseInt(el.getAttribute('data-mi'), 10));
});
$('btnRecite').addEventListener('click', doRecite);
$('btnClear').addEventListener('click', clearPicks);
$('btnReset').addEventListener('click', function () { startMonster(S.mi); });
$('btnCodex').addEventListener('click', showCodex);
$('btnRules').addEventListener('click', showRules);
$('anchors').addEventListener('click', function (ev) {
  var el = ev.target;
  if (!el || !el.getAttribute || !el.getAttribute('data-w')) return;
  doAnchor(el.getAttribute('data-w'));
});
$('ov').addEventListener('click', function (ev) {
  if (ev.target === $('ov')) closeModal();
});

startMonster(0);
</script>
