<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>COC7 战图工具 玩家端</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;--accent:#e94560;--purple:#533483;--text:#eee;--muted:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#topBar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid #3a3a5e;flex-shrink:0}
#topBar .logo{font-size:15px;font-weight:700;color:var(--accent)}
.top-btn{background:var(--purple);color:#fff;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.top-btn:hover{background:var(--accent)}
#mainBody{display:flex;flex:1;overflow:hidden}
#viewPanel{flex:1;position:relative;background:#0b0b18;display:flex;align-items:center;justify-content:center;overflow:hidden}
#fpCanvas{border:2px solid #3a3a5e;cursor:crosshair}
#viewInfo{position:absolute;top:28px;left:170px;font-size:11px;color:var(--muted);background:rgba(0,0,0,0.75);padding:4px 8px;border-radius:4px;pointer-events:none;z-index:11}
#minimap{position:absolute;top:8px;left:8px;z-index:10;pointer-events:none}
#minimap canvas{border:1px solid rgba(233,69,96,0.5);border-radius:4px;background:rgba(0,0,0,0.65)}
#moveCtrl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px}
.move-btn{width:50px;height:50px;border:2px solid var(--accent);background:rgba(233,69,96,0.12);color:var(--accent);font-size:22px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;user-select:none}
.move-btn:hover{background:rgba(233,69,96,0.3)}
.move-btn:active{transform:scale(0.9)}
.move-btn.disabled{opacity:0.25;pointer-events:none}
.move-col{display:flex;flex-direction:column;gap:6px;align-items:center}
#interactPopup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--accent);border-radius:8px;padding:14px 18px;min-width:260px;z-index:20;display:none;box-shadow:0 4px 24px rgba(0,0,0,0.8)}
#interactPopup h4{color:var(--accent);margin-bottom:8px;font-size:13px}
.interact-opt{background:var(--bg3);border:1px solid #3a3a5e;border-radius:4px;padding:6px 10px;cursor:pointer;font-size:12px;margin-bottom:4px;transition:all 0.12s}
.interact-opt:hover{border-color:var(--accent);background:rgba(233,69,96,0.1)}
#diceOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:center;justify-content:center}
#diceOverlay.open{display:flex}
#diceBox{background:var(--bg2);border:1px solid #3a3a5e;border-radius:8px;padding:20px;max-width:380px;width:90%}
#diceBox h3{color:var(--accent);margin-bottom:10px;font-size:14px}
#diceRollArea{margin:10px 0;padding:12px;background:var(--bg3);border-radius:6px;text-align:center}
.dice-num{font-size:36px;font-weight:700;color:var(--accent)}
.dice-grade{font-size:13px;margin-top:4px}
.dice-grade.crit{color:#4f4}.dice-grade.fumble{color:var(--accent)}
.dice-acts{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.dice-acts button{background:var(--purple);color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:11px}
.dice-acts button:hover{background:var(--accent)}
#diceClose{margin-top:10px;background:var(--bg3);color:var(--text);border:1px solid #3a3a5e;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:12px}
#rightPanel{width:270px;background:var(--bg2);border-left:1px solid #3a3a5e;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#rightPanel h3{font-size:13px;color:var(--accent);padding:8px 12px 4px;border-bottom:1px solid #3a3a5e}
#charDisplay{flex:1;padding:8px;overflow-y:auto}
.char-empty{color:var(--muted);text-align:center;padding:20px;font-size:12px}
.ch-card{background:var(--bg3);border:1px solid #3a3a5e;border-radius:6px;padding:10px;margin-bottom:8px;font-size:12px;line-height:1.7}
.ch-name{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:4px}
.ch-row{display:flex;gap:8px;justify-content:space-between;margin-bottom:2px}
.ch-stat{flex:1;text-align:center}
.ch-val{font-size:15px;font-weight:700}
.ch-lbl{font-size:10px;color:var(--muted)}
.ch-hp{color:#e94560}.ch-mp{color:#44aaff}.ch-san{color:#ffaa00}
.sk-btn{display:inline-block;background:var(--bg);border:1px solid #3a3a5e;color:var(--text);padding:2px 7px;border-radius:3px;font-size:10px;cursor:pointer;margin:1px 2px;transition:all 0.12s}
.sk-btn:hover{border-color:var(--accent);color:var(--accent)}
.it-tag{display:inline-block;background:var(--bg);border:1px solid #3a3a5e;padding:1px 6px;border-radius:3px;font-size:10px;margin:1px 2px}
#bottomBar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg2);border-top:1px solid #3a3a5e;flex-shrink:0;min-height:62px}
#charSlots{display:flex;gap:6px;flex:1;overflow-x:auto}
.ch-slot{width:54px;height:50px;border:2px solid #3a3a5e;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg3);transition:all 0.15s;flex-shrink:0;position:relative}
.ch-slot:hover{border-color:var(--accent)}
.ch-slot.active{border-color:var(--accent);background:rgba(233,69,96,0.12)}
.ch-slot .s-name{font-size:10px;max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-slot .s-bars{width:100%;padding:0 3px}
.bar-w{height:3px;background:var(--bg);border-radius:2px;margin:1px 0}
.bar-f{height:100%;border-radius:2px;transition:width 0.3s}
.bf-hp{background:var(--accent)}.bf-mp{background:#44aaff}.bf-san{background:#ffaa00}
.s-empty{font-size:18px;color:var(--muted)}
#bottomActs{display:flex;gap:4px;margin-left:auto}
.ba-btn{background:var(--bg3);border:1px solid #3a3a5e;color:var(--text);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:10px;white-space:nowrap}
.ba-btn:hover{border-color:var(--accent);color:var(--accent)}
#combatOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:none;align-items:center;justify-content:center}
#combatOverlay.open{display:flex}
#combatPanel{background:var(--bg2);border:2px solid var(--accent);border-radius:10px;padding:16px 20px;max-width:600px;width:92%;max-height:80vh;overflow-y:auto}
#combatPanel h2{color:var(--accent);margin-bottom:10px;font-size:15px}
.combat-log{font-size:11px;line-height:1.7;max-height:180px;overflow-y:auto;background:rgba(0,0,0,0.3);padding:6px 8px;border-radius:4px;margin-bottom:8px}
.combat-opts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.c-opt{padding:7px 10px;background:var(--bg3);border:1px solid #3a3a5e;border-radius:5px;cursor:pointer;font-size:11px;text-align:center;flex:1;min-width:70px;transition:all 0.12s}
.c-opt:hover{border-color:var(--accent)}
.c-opt .c-name{font-weight:600;color:var(--text)}
.c-opt .c-dice{color:var(--muted);font-size:10px}
#btnKouhu{background:var(--purple);color:#fff;border:none;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;margin-top:8px;transition:all 0.15s}
#btnKouhu:hover{background:var(--accent)}
#kouhuArea{display:none;margin-top:8px;padding:8px;background:rgba(0,0,0,0.3);border-radius:6px}
.kh-skill{padding:4px 8px;background:var(--bg3);border:1px solid #3a3a5e;border-radius:4px;cursor:pointer;font-size:11px;margin:2px;display:inline-block;transition:all 0.12s}
.kh-skill:hover{border-color:var(--accent);color:var(--accent)}
#recordPanel{position:fixed;right:0;top:0;bottom:0;width:300px;background:var(--bg2);border-left:1px solid #3a3a5e;z-index:150;display:none;flex-direction:column}
#recordPanel.open{display:flex}
#recHead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #3a3a5e}
#recHead h3{color:var(--accent);font-size:13px}
#recList{flex:1;overflow-y:auto;padding:6px 8px;font-size:11px;line-height:1.7}
.rec-entry{border-left:2px solid #3a3a5e;padding:2px 6px;margin-bottom:3px}
.rec-time{color:var(--muted);font-size:9px}
.rec-char{color:var(--accent);font-size:10px}
#recFoot{display:flex;gap:4px;padding:6px 8px;border-top:1px solid #3a3a5e}
#recToggle{position:fixed;right:8px;bottom:70px;z-index:160;background:var(--purple);color:#fff;border:none;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:10px;line-height:1.3}
.ch-dying{color:#a33;font-weight:700}
.damage-roll{color:#e94560;font-weight:700}
.heal-roll{color:#4f4}

/* ========== 物品获取界面 ========== */
#itemPickupModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:120;align-items:center;justify-content:center}
#itemPickupModal.open{display:flex}
#itemPickupBox{background:var(--bg2);border:2px solid var(--accent);border-radius:10px;padding:16px 20px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto}
#itemPickupBox h3{color:var(--accent);margin-bottom:10px;font-size:14px}
.pickup-item{background:var(--bg3);border:1px solid #3a3a5e;border-radius:6px;padding:8px 12px;margin-bottom:6px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:8px}
.pickup-item:hover{border-color:var(--accent);background:rgba(233,69,96,0.1)}
.pickup-icon{font-size:20px;width:30px;text-align:center}
.pickup-info{flex:1}
.pickup-name{font-size:13px;font-weight:600;color:var(--text)}
.pickup-desc{font-size:10px;color:var(--muted);margin-top:2px}
.pickup-btn{background:var(--purple);color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.pickup-btn:hover{background:var(--accent)}

/* ========== 物品使用界面 ========== */
#itemUseModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:120;align-items:center;justify-content:center}
#itemUseModal.open{display:flex}
#itemUseBox{background:var(--bg2);border:2px solid var(--accent);border-radius:10px;padding:16px 20px;max-width:380px;width:90%}
#itemUseBox h3{color:var(--accent);margin-bottom:8px;font-size:14px}
.use-item-info{background:var(--bg3);border-radius:6px;padding:8px;margin-bottom:10px;font-size:12px;line-height:1.6}
.use-item-opts{display:flex;gap:6px;flex-wrap:wrap}
.use-opt-btn{background:var(--bg3);border:1px solid #3a3a5e;color:var(--text);padding:6px 12px;border-radius:5px;cursor:pointer;font-size:11px;transition:all 0.12s}
.use-opt-btn:hover{border-color:var(--accent);color:var(--accent)}
.use-opt-btn.danger{border-color:#a33;color:#a33}
.use-opt-btn.danger:hover{background:rgba(163,51,51,0.2)}
#itemUseClose{margin-top:10px;background:var(--bg3);color:var(--text);border:1px solid #3a3a5e;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:12px}

/* ========== 角色卡物品可点击 ========== */
.it-tag.clickable{cursor:pointer;transition:all 0.12s}
.it-tag.clickable:hover{background:var(--accent);color:#fff}
.key-hint{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(233,69,96,0.7)}70%{box-shadow:0 0 0 6px rgba(233,69,96,0)}100%{box-shadow:0 0 0 0 rgba(233,69,96,0)}}

</style>
</head>
<body>

<div id="topBar">
  <span class="logo">COC7 战图 - 玩家端</span>
  <div style="flex:1"></div>
  <button class="top-btn" onclick="openMapImport()">导入地图</button>
  <button class="top-btn" onclick="openCharImport()">导入角色</button>
  <button class="top-btn" onclick="toggleRecord()">记录</button>
</div>

<div id="mainBody">
  <div id="viewPanel">
    <canvas id="fpCanvas" width="800" height="500"></canvas>
    <div id="viewInfo">未载入地图</div>
    <div id="minimap"><canvas id="minimapCanvas" width="154" height="154"></canvas></div>
    <div id="moveCtrl">
      <div class="move-col"><button class="move-btn" onclick="turnLeft()">L</button></div>
      <div class="move-col">
        <button class="move-btn" id="btnFwd" onclick="moveForward()">^</button>
        <button class="move-btn" id="btnBack" onclick="moveBack()">v</button>
      </div>
      <div class="move-col"><button class="move-btn" onclick="turnRight()">R</button></div>
    </div>
    <div id="interactPopup">
      <h4 id="iTitle">面对着某物</h4>
      <div id="iOptions"></div>
    </div>
  </div>
  <div id="rightPanel">
    <h3>角色卡</h3>
    <div id="charDisplay"><div class="char-empty">点击下方角色槽<br>或点击"导入角色"按钮</div></div>
  </div>
</div>

<div id="bottomBar">
  <div id="charSlots"></div>
  <div id="bottomActs">
    <button class="ba-btn" onclick="saveChars()">保存</button>
    <button class="ba-btn" onclick="exportChars()">导出</button>
  </div>
</div>

<div id="diceOverlay">
  <div id="diceBox">
    <h3 id="diceTitle">掷骰检定</h3>
    <div id="diceRollArea"></div>
    <div id="diceActs" class="dice-acts"></div>
    <div id="diceKouhuArea" style="display:none;margin-top:8px;padding:8px;background:rgba(0,0,0,0.3);border-radius:6px"></div>
    <button id="diceClose" onclick="closeDice()">关闭</button>
  </div>
</div>

<div id="combatOverlay">
  <div id="combatPanel">
    <h2 id="combatTitle">战斗轮</h2>
    <div class="combat-log" id="combatLog"></div>
    <div id="combatBody"></div>
    <button id="btnKouhu" onclick="toggleKouhu()">口胡!</button>
    <div id="kouhuArea"></div>
  </div>
</div>

<div id="mapImportModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center">
  <div style="background:var(--bg2);border:1px solid #3a3a5e;border-radius:8px;padding:18px;max-width:480px;width:90%">
    <h3 style="color:var(--accent);margin-bottom:10px">导入地图SEAB码</h3>
    <textarea id="mapImportInput" style="width:100%;min-height:80px;background:var(--bg3);border:1px solid #3a3a5e;color:var(--text);padding:8px;border-radius:4px;font-size:11px;font-family:monospace;resize:vertical" placeholder="粘贴哦齁- 或 SEAB- 格式的地图码..."></textarea>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="top-btn" onclick="doImportMap()">导入</button>
      <button class="top-btn" style="background:var(--bg3)" onclick="closeMapImport()">取消</button>
    </div>
  </div>
</div>

<div id="charImportModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center">
  <div style="background:var(--bg2);border:1px solid #3a3a5e;border-radius:8px;padding:18px;max-width:480px;width:90%">
    <h3 style="color:var(--accent);margin-bottom:10px">导入角色SEAB码</h3>
    <textarea id="charImportInput" style="width:100%;min-height:80px;background:var(--bg3);border:1px solid #3a3a5e;color:var(--text);padding:8px;border-radius:4px;font-size:11px;font-family:monospace;resize:vertical" placeholder="粘贴角色SEAB码"></textarea>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="top-btn" onclick="doImportChar()">导入</button>
      <button class="top-btn" style="background:var(--bg3)" onclick="closeCharImport()">取消</button>
    </div>
  </div>
</div>

<!-- 物品获取界面 -->
<div id="itemPickupModal">
  <div id="itemPickupBox">
    <h3 id="pickupTitle">发现物品</h3>
    <div id="pickupList"></div>
    <button onclick="closeItemPickup()" style="margin-top:10px;background:var(--bg3);color:var(--text);border:1px solid #3a3a5e;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:12px">关闭</button>
  </div>
</div>

<!-- 物品使用界面 -->
<div id="itemUseModal">
  <div id="itemUseBox">
    <h3 id="useTitle">使用物品</h3>
    <div class="use-item-info" id="useItemInfo"></div>
    <div class="use-item-opts" id="useItemOpts"></div>
    <button id="itemUseClose" onclick="closeItemUse()">关闭</button>
  </div>
</div>

<button id="recToggle" onclick="toggleRecord()">记录</button>
<div id="recordPanel">
  <div id="recHead">
    <h3>跑团记录</h3>
    <button onclick="toggleRecord()" style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer">X</button>
  </div>
  <div id="recList"></div>
  <div id="recFoot">
    <button class="ba-btn" style="flex:1" onclick="exportRecord()">导出</button>
    <button class="ba-btn" style="flex:1" onclick="clearRecord()">清空</button>
  </div>
</div>

<script>
// ========== SEAB 解码 ==========
var B64C='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
var ONMO='啊叮呼噜呜嗷嘎叽咕哼唧嘤啪嗒啦嘻哈喔咿呀嘞嘣嗖呃咦嘁呲唰嗤嘘嗄噗咻嗳嘌唏嗔啧嗝嗐嗬哎噢嗗嘟铛~!@#$%^&*()_+-|[]<';
var PREFIX='哦齁-';

function deOnmo(s){
  if(!s.startsWith(PREFIX)) return null;
  var b=s.slice(PREFIX.length),r='';
  for(var i=0;i<b.length;i++){
    var x=ONMO.indexOf(b[i]);
    r+=x<0?b[i]:B64C[x];
  }
  return r;
}

function decodeSeab(code){
  var b64;
  if(code.startsWith(PREFIX)){
    b64=deOnmo(code);
    if(!b64) throw new Error('哦齁码解析失败');
  }else if(code.startsWith('SEAB-')){
    b64=code.slice(5);
  }else{
    throw new Error('无效SEAB码，请以"哦齁-"或"SEAB-"开头');
  }
  // 可靠地解码 UTF-8 base64
  var binaryStr=atob(b64);
  var bytes=new Uint8Array(binaryStr.length);
  for(var i=0;i<binaryStr.length;i++) bytes[i]=binaryStr.charCodeAt(i);
  var json=new TextDecoder('utf-8').decode(bytes);
  return JSON.parse(json);
}

// ========== 状态变量 ==========
var mapState=null;
var playerPos=null;
var DIR4=[[-1,0],[0,1],[1,0],[0,-1]];
var characters=[];
var activeCharIdx=-1;
var combatState=null;
var recordLog=[];

// Canvas
var cv=document.getElementById('fpCanvas');
var cx=cv.getContext('2d');
var mmcv=document.getElementById('minimapCanvas');
var mmcx=mmcv.getContext('2d');

// ========== 地图导入 ==========
function openMapImport(){ document.getElementById('mapImportModal').style.display='flex'; }
function closeMapImport(){ document.getElementById('mapImportModal').style.display='none'; }

function doImportMap(){
  var raw=document.getElementById('mapImportInput').value.trim();
  if(!raw){alert('请粘贴地图SEAB码');return;}
  try{
    var d=decodeSeab(raw);
    if(d.v!=='map') throw new Error('非地图SEAB码');
    mapState=d;
    playerPos=findSpawn();
    closeMapImport();
    renderView();
    addRec('系统','地图已载入, 出生点:('+playerPos.r+','+playerPos.c+')','system');
  }catch(e){alert('导入失败:'+e.message);}
}

function findSpawn(){
  if(!mapState) return{r:1,c:1,dir:0};
  for(var k in mapState.cells){
    var cd=mapState.cells[k];
    if(cd&&cd.type==='spawn'){
      var parts=k.split(',');
      return{r:parseInt(parts[0]),c:parseInt(parts[1]),dir:0};
    }
  }
  return{r:1,c:1,dir:0};
}

// ========== 主渲染 ==========
function renderView(){
  cx.fillStyle='#111';
  cx.fillRect(0,0,cv.width,cv.height);
  if(!mapState||!playerPos){
    updateViewInfo();
    drawMinimap();
    return;
  }
  drawFP();
  updateViewInfo();
  updateMoveBtns();
  checkFacing();
  drawMinimap();
}

// ========== 光线投射第一人称渲染 ==========
function castRay(angle){
  if(!mapState||!playerPos) return{distance:Infinity,cell:null};
  var r=playerPos.r, c=playerPos.c;
  var px=c+0.5, py=r+0.5;
  var dx=Math.cos(angle), dy=Math.sin(angle);
  var x=px, y=py;
  var step=0.06;
  for(var i=0;i<350;i++){
    x+=dx*step; y+=dy*step;
    var cc=Math.floor(x), cr=Math.floor(y);
    if(cr<0||cr>=mapState.rows||cc<0||cc>=mapState.cols)
      return{distance:Infinity,cell:null};
    var cell=mapState.cells[cr+','+cc];
    if(cell&&cell.type&&cell.type!=='empty'&&cell.type!=='spawn'){
      var rawDist=i*step;
      var viewAngle=[3*Math.PI/2,0,Math.PI/2,Math.PI][playerPos.dir];
      var perpDist=rawDist*Math.cos(angle-viewAngle);
      return{distance:Math.max(perpDist,0.01),cell};
    }
  }
  return{distance:Infinity,cell:null};
}

function drawFP(){
  var W=cv.width, H=cv.height;
  var horizon=H*0.5;
  // 天空渐变
  var sky=cx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#0a0a1e');
  sky.addColorStop(1,'#1a1a3e');
  cx.fillStyle=sky;
  cx.fillRect(0,0,W,horizon);
  // 地面渐变
  var grd=cx.createLinearGradient(0,horizon,0,H);
  grd.addColorStop(0,'#111125');
  grd.addColorStop(1,'#0a0a12');
  cx.fillStyle=grd;
  cx.fillRect(0,horizon,W,H-horizon);
  // 视平线
  cx.strokeStyle='rgba(233,69,96,0.2)';
  cx.lineWidth=1;
  cx.beginPath();
  cx.moveTo(0,horizon);
  cx.lineTo(W,horizon);
  cx.stroke();

  if(!mapState||!playerPos) return;

  var viewAngle=[3*Math.PI/2,0,Math.PI/2,Math.PI][playerPos.dir];
  var halfFOV=Math.PI/4;
  var colW=2;
  for(var col=0;col<W;col+=colW){
    var rayAngle=viewAngle-halfFOV+(col/W)*2*halfFOV;
    var hit=castRay(rayAngle);
    if(hit.distance<Infinity&&hit.cell){
      var sliceH=Math.min(H,(1/hit.distance)*280);
      var top=(H-sliceH)/2;
      var t=hit.cell.type;
      var baseColor='';
      if(t==='wall1') baseColor='#4a4a5e';
      else if(t==='wall2') baseColor='#5a5a6e';
      else if(t==='wall3') baseColor='#5e4a4a';
      else if(t==='wall4') baseColor='rgba(60,100,60,0.65)';
      else if(t==='door') baseColor=hit.cell.open?'rgba(107,78,46,0.3)':'#6b4e2e';
      else if(t==='monster') baseColor='rgba(130,30,30,0.5)';
      else baseColor='#333';

      if(typeof baseColor==='string'&&baseColor.startsWith('#')&&baseColor.length===7){
        var rc=parseInt(baseColor.slice(1,3),16);
        var gc=parseInt(baseColor.slice(3,5),16);
        var bc=parseInt(baseColor.slice(5,7),16);
        var sideFade=Math.abs(Math.cos(rayAngle-viewAngle))<0.7?0.7:1;
        rc=Math.floor(rc*sideFade);
        gc=Math.floor(gc*sideFade);
        bc=Math.floor(bc*sideFade);
        cx.fillStyle='rgb('+rc+','+gc+','+bc+')';
      }else{
        cx.fillStyle=baseColor;
      }
      cx.fillRect(col,top,colW+1,sliceH);

      // 门框
      if(t==='door'&&!hit.cell.open){
        cx.fillStyle='rgba(120,80,30,0.45)';
        cx.fillRect(col,top,colW+1,sliceH);
      }
    }
  }
}

// ========== 小地图渲染 ==========
function drawMinimap(){
  if(!mapState||!playerPos){mmcx.clearRect(0,0,mmcv.width,mmcv.height);return;}
  var cellSize=5;
  var cols=mapState.cols, rows=mapState.rows;
  var totalW=cols*cellSize, totalH=rows*cellSize;
  var ox=Math.floor((mmcv.width-totalW)/2), oy=Math.floor((mmcv.height-totalH)/2);
  mmcx.clearRect(0,0,mmcv.width,mmcv.height);

  // 画格子
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var cd=mapState.cells[r+','+c];
      var clr='rgba(0,0,0,0.2)';
      if(cd){
        var t=cd.type;
        if(t==='wall1'||t==='wall2') clr='#4a4a5e';
        else if(t==='wall3') clr='#5e4a4a';
        else if(t==='wall4') clr='rgba(60,100,60,0.5)';
        else if(t==='door') clr=cd.open?'rgba(107,78,46,0.25)':'#6b4e2e';
        else if(t==='chest') clr='#5e5020';
        else if(t==='item') clr='rgba(30,80,130,0.45)';
        else if(t==='monster') clr='rgba(130,30,30,0.45)';
        else if(t==='spawn') clr='rgba(30,130,60,0.25)';
        else if(t==='portal') clr='rgba(30,130,130,0.25)';
        else if(t==='event') clr='rgba(100,30,130,0.25)';
      }
      mmcx.fillStyle=clr;
      mmcx.fillRect(ox+c*cellSize,oy+r*cellSize,cellSize-0.5,cellSize-0.5);
    }
  }

  // 画玩家位置（三角形表示朝向）
  var px=ox+playerPos.c*cellSize+cellSize/2;
  var py=oy+playerPos.r*cellSize+cellSize/2;
  var dir=playerPos.dir;
  var arrowSize=cellSize*0.6;
  mmcx.save();
  mmcx.translate(px,py);
  var angles=[-Math.PI/2,0,Math.PI/2,Math.PI];
  mmcx.rotate(angles[dir]);
  mmcx.fillStyle='#e94560';
  mmcx.beginPath();
  mmcx.moveTo(0,-arrowSize/2);
  mmcx.lineTo(-arrowSize/3,arrowSize/3);
  mmcx.lineTo(arrowSize/3,arrowSize/3);
  mmcx.closePath();
  mmcx.fill();
  mmcx.restore();

  // 画玩家视野方向线
  mmcx.strokeStyle='rgba(233,69,96,0.45)';
  mmcx.lineWidth=1;
  mmcx.beginPath();
  mmcx.moveTo(px,py);
  var [dr,dc]=DIR4[dir];
  mmcx.lineTo(px+dc*arrowSize,py+dr*arrowSize);
  mmcx.stroke();

  // 画格子边框
  mmcx.strokeStyle='rgba(255,255,255,0.06)';
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      mmcx.strokeRect(ox+c*cellSize,oy+r*cellSize,cellSize,cellSize);
    }
  }
}

// ========== 移动控制 ==========
function updateMoveBtns(){
  var btn=document.getElementById('btnFwd');
  if(btn) btn.classList.toggle('disabled',!canMoveFwd());
}

function canMoveFwd(){
  if(!mapState||!playerPos) return false;
  var {r,c,dir}=playerPos;
  var [dr,dc]=DIR4[dir];
  var nr=r+dr, nc=c+dc;
  if(nr<0||nr>=mapState.rows||nc<0||nc>=mapState.cols) return false;
  var cd=mapState.cells[nr+','+nc];
  if(!cd||cd.type==='empty') return true;
  if(cd.type==='door'&&!cd.open) return false;
  if(cd.type&&cd.type.startsWith('wall')) return false;
  return true;
}

function moveForward(){
  if(!mapState||!playerPos) return;
  var {r,c,dir}=playerPos;
  var [dr,dc]=DIR4[dir];
  var nr=r+dr, nc=c+dc;
  if(nr<0||nr>=mapState.rows||nc<0||nc>=mapState.cols){
    addRec(getCharName(),'前进:已到地图边缘','action');return;
  }
  var key=nr+','+nc;
  var cd=mapState.cells[key];
  if(cd&&cd.type&&cd.type.startsWith('wall')){
    addRec(getCharName(),'前方有墙','action');
    if(cd.type==='wall3'||cd.type==='wall4'){
      showInteract('前方是可破坏的墙','尝试破坏',function(){tryBreakWall(nr,nc);});
    }
    renderView();return;
  }
  if(cd&&cd.type==='door'&&!cd.open){
    addRec(getCharName(),'前方有门(关闭)','action');
    showInteract('前方:'+(cd.name||'门'),'尝试开门',function(){tryOpenDoor(nr,nc);});
    renderView();return;
  }
  playerPos.r=nr;playerPos.c=nc;
  addRec(getCharName(),'前进到('+nr+','+nc+')','move');
  renderView();
  afterMove(nr,nc);
}

function moveBack(){
  if(!mapState||!playerPos) return;
  var {r,c,dir}=playerPos;
  var [dr,dc]=DIR4[dir];
  var nr=r-dr, nc=c-dc;
  if(nr<0||nr>=mapState.rows||nc<0||nc>=mapState.cols){
    addRec(getCharName(),'后退:已到地图边缘','action');return;
  }
  var key=nr+','+nc;
  var cd=mapState.cells[key];
  if(cd&&cd.type&&cd.type.startsWith('wall')){
    addRec(getCharName(),'后方有墙','action');renderView();return;
  }
  playerPos.r=nr;playerPos.c=nc;
  addRec(getCharName(),'后退到('+nr+','+nc+')','move');
  renderView();
}

function turnLeft(){
  if(!playerPos) return;
  playerPos.dir=(playerPos.dir+3)%4;
  addRec(getCharName(),'左转,现朝'+['北','东','南','西'][playerPos.dir],'action');
  renderView();
}
function turnRight(){
  if(!playerPos) return;
  playerPos.dir=(playerPos.dir+1)%4;
  addRec(getCharName(),'右转,现朝'+['北','东','南','西'][playerPos.dir],'action');
  renderView();
}

// ========== 交互系统 ==========
function checkFacing(){
  var fc=getFacingCell();
  var pop=document.getElementById('interactPopup');
  if(!fc){pop.style.display='none';return;}
  var k=fc.key, cell=fc.cell;
  if(!cell||cell.type==='empty'||cell.type==='spawn'){pop.style.display='none';return;}
  if(cell.type==='wall1'||cell.type==='wall2'){pop.style.display='none';return;}
  var lbls={door:'门',chest:'箱子',item:'物品/线索',monster:'怪物',event:'事件',portal:'传送门',wall3:'可破坏墙',wall4:'可破透明墙'};
  var lbl=lbls[cell.type]||cell.type;
  if(cell.type==='door'&&!cell.open){
    showInteract('前方:'+(cell.name||lbl),'开门',function(){tryOpenDoorByFacing();});
  }else if(cell.type==='chest'){
    showInteract('前方:'+(cell.name||lbl),'调查',function(){interactChest(k,cell);});
  }else if(cell.type==='item'){
    showInteract('前方:物品/线索','调查',function(){interactItem(k,cell);});
  }else if(cell.type==='monster'){
    showInteract('前方:怪物!','进入战斗',function(){startCombat(k,cell);});
  }else if(cell.type==='event'){
    showInteract('前方:事件','触发',function(){triggerEvent(k,cell);});
  }else if(cell.type==='portal'){
    showInteract('前方:'+(cell.name||'传送门'),'进入',function(){usePortal(k,cell);});
  }else if(cell.type==='wall3'||cell.type==='wall4'){
    showInteract('前方:'+lbl,'尝试破坏',function(){tryBreakWallByFacing();});
  }else{pop.style.display='none';}
}

function getFacingCell(){
  if(!mapState||!playerPos) return null;
  var {r,c,dir}=playerPos;
  var [dr,dc]=DIR4[dir];
  var nr=r+dr, nc=c+dc;
  if(nr<0||nr>=mapState.rows||nc<0||nc>=mapState.cols) return null;
  var key=nr+','+nc;
  return{key:key,cell:mapState.cells[key]||{type:'empty'}};
}

function showInteract(title,optText,callback){
  var pop=document.getElementById('interactPopup');
  document.getElementById('iTitle').textContent=title;
  var optDiv=document.getElementById('iOptions');
  optDiv.innerHTML='<div class="interact-opt" id="iOptBtn">'+optText+'</div>';
  document.getElementById('iOptBtn').onclick=function(){
    pop.style.display='none';
    callback();
  };
  pop.style.display='block';
}

function tryOpenDoorByFacing(){
  var fc=getFacingCell(); if(!fc) return;
  var parts=fc.key.split(',');
  tryOpenDoor(parseInt(parts[0]),parseInt(parts[1]));
}
function tryBreakWallByFacing(){
  var fc=getFacingCell(); if(!fc) return;
  var parts=fc.key.split(',');
  tryBreakWall(parseInt(parts[0]),parseInt(parts[1]));
}

function tryOpenDoor(r,c){
  var key=r+','+c, cd=mapState.cells[key];
  if(!cd||cd.type!=='door') return;
  if(cd.open){addRec(getCharName(),'门已开启','action');return;}
  if(cd.difficulty>0){
    doDiceRoll('开门:'+(cd.name||'门'),cd.difficulty,function(ok){
      if(ok){cd.open=true;addRec(getCharName(),'成功打开门','result');renderView();}
      else{addRec(getCharName(),'未能打开门','result');}
    });
  }else{
    cd.open=true;addRec(getCharName(),'打开了门','result');renderView();
  }
}

function tryBreakWall(r,c){
  var key=r+','+c, cd=mapState.cells[key];
  if(!cd||(cd.type!=='wall3'&&cd.type!=='wall4')) return;
  var ch=characters[activeCharIdx];
  var s=(ch&&ch.attrs)?ch.attrs[0]:50;
  doDiceRoll('破坏墙壁(力量'+s+')',s,function(ok){
    if(ok){delete mapState.cells[key];addRec(getCharName(),'破坏了墙壁','result');renderView();}
    else{addRec(getCharName(),'未能破坏墙壁','result');}
  });
}

function interactChest(key,cell){
  addRec(getCharName(),'调查箱子','action');

  // 检查背包是否有对应钥匙（如果箱子有keyId）
  if(cell.keyId){
    if(characters[activeCharIdx]&&characters[activeCharIdx].items){
      var hasKey=characters[activeCharIdx].items.find(function(it){return String(it.id)===String(cell.keyId);});
      if(hasKey){
        var keyName=hasKey.name||'钥匙';
        if(confirm('发现箱子，背包中有钥匙【'+keyName+'】，是否直接使用钥匙打开？')){
          useKeyOnChest(key,cell,hasKey);
          return;
        }
      }
    }
  }

  if(cell.difficulty>0){
    doDiceRoll('调查箱子',cell.difficulty,function(ok){
      if(ok){
        addRec(getCharName(),'成功打开箱子','result');
        showChestItems(key,cell);
      }else{
        addRec(getCharName(),'未能打开箱子','result');
      }
    });
  }else{
    addRec(getCharName(),'直接打开了箱子','result');
    showChestItems(key,cell);
  }
}

// 使用钥匙开箱
function useKeyOnChest(key,cell,keyItem){
  addRec(getCharName(),'使用钥匙【'+keyItem.name+'】打开箱子','result');
  // 从背包移除钥匙
  if(characters[activeCharIdx]&&characters[activeCharIdx].items){
    var idx=-1;
    for(var i=0;i<characters[activeCharIdx].items.length;i++){
      if(String(characters[activeCharIdx].items[i].id)===String(keyItem.id)){idx=i;break;}
    }
    if(idx>=0) characters[activeCharIdx].items.splice(idx,1);
  }
  renderCharDisp();renderSlots();
  showChestItems(key,cell);
}

// 显示箱子中的物品
function showChestItems(key,cell){
  var items=[];
  // 箱子有绑定的物品
  if(cell.itemId&&mapState&&mapState.spareItems){
    var it=mapState.spareItems.find(function(i){return String(i.id)===String(cell.itemId);});
    if(it) items.push(it);
  }
  // 如果箱子有items列表（KP端可能设置）
  if(cell.items&&cell.items.length){
    cell.items.forEach(function(itemId){
      var it=mapState&&mapState.spareItems?mapState.spareItems.find(function(i){return String(i.id)===String(itemId);}):null;
      if(it) items.push(it);
    });
  }
  if(!items.length){
    addRec(getCharName(),'箱子是空的','result');
    return;
  }
  showItemPickup(items,'箱子中的物品');
}

// 显示物品线索的物品
function showItemPickup(items,title){
  var list=document.getElementById('pickupList');
  var h='';
  items.forEach(function(it,i){
    var icon='📦';
    if(it.category==='weapon') icon='⚔️';
    else if(it.category==='clue') icon='📜';
    else if(it.category==='prop') icon='🎒';
    else if(it.name&&it.name.indexOf('钥匙')>=0) icon='🔑';
    h+='<div class="pickup-item" onclick="pickupItem('+i+')">'
      +'<div class="pickup-icon">'+icon+'</div>'
      +'<div class="pickup-info">'
      +'<div class="pickup-name">'+escH(it.name)+'</div>'
      +'<div class="pickup-desc">'+(it.desc||'无描述')+'</div>'
      +'</div>'
      +'<button class="pickup-btn">拾取</button>'
      +'</div>';
  });
  list.innerHTML=h;
  document.getElementById('pickupTitle').textContent=title||'发现物品';
  document.getElementById('itemPickupModal').classList.add('open');

  // 保存临时物品列表
  window._pickupItems=items;
}

function pickupItem(idx){
  if(!window._pickupItems||!window._pickupItems[idx]) return;
  var it=window._pickupItems[idx];
  addItemToChar(it);
  addRec(getCharName(),'获得物品:'+it.name,'result');
  // 移除已拾取的物品
  window._pickupItems.splice(idx,1);
  if(window._pickupItems.length<=0){
    closeItemPickup();
  }else{
    showItemPickup(window._pickupItems,document.getElementById('pickupTitle').textContent);
  }
}

function closeItemPickup(){
  document.getElementById('itemPickupModal').classList.remove('open');
  window._pickupItems=null;
}

function interactItem(key,cell){
  addRec(getCharName(),'调查物品/线索','action');
  if(cell.itemId&&mapState&&mapState.spareItems){
    var it=mapState.spareItems.find(function(i){return String(i.id)===String(cell.itemId);});
    if(it){
      showItemPickup([it],'发现物品:'+(cell.name||'未命名'));
      return;
    }
  }
  addRec(getCharName(),'未发现可获取的物品','result');
}

function startCombat(key,cell){
  if(!cell.monsterId||!mapState.monsters) return;
  var mon=mapState.monsters.find(function(m){return String(m.id)===String(cell.monsterId);});
  if(!mon) return;
  addRec(getCharName(),'遭遇怪物:'+mon.name,'combat');
  initCombat(mon,key);
}

function triggerEvent(key,cell){
  addRec(getCharName(),'触发事件:'+(cell.popupText||''),'event');
  if(cell.popupText) setTimeout(function(){alert(cell.popupText);},100);
}

function usePortal(key,cell){
  addRec(getCharName(),'使用传送门','action');
  if(cell.targetCode){
    try{
      var d=decodeSeab(cell.targetCode);
      if(d.v==='map'){mapState=d;playerPos=findSpawn();addRec(getCharName(),'传送到新地图','result');renderView();}
    }catch(e){addRec(getCharName(),'传送失败:'+e.message,'result');}
  }
}

function afterMove(r,c){
  var key=r+','+c, cd=mapState.cells[key];
  if(cd&&cd.type==='item'){interactItem(key,cd);}
  if(cd&&cd.type==='chest'){interactChest(key,cd);}
}

// ========== 战斗系统（完整修复版）==========
function initCombat(monster,cellKey){
  var detected=false;
  characters.forEach(function(ch){
    if(!ch.skills) return;
    ch.skills.forEach(function(sk){
      if((sk[0]==='侦察'||sk[0]==='聆听')&&!detected){
        var v=(sk[1]||0)+(sk[2]||0),d=roll100();
        if(d<=v){detected=true;addRec(ch.name,'侦察/聆听成功!提前发现'+monster.name,'combat');}
      }
    });
  });

  // 先攻计算（总是排序，修复原bug）
  var order=[];
  characters.forEach(function(ch,i){
    var dex=(ch.attrs&&ch.attrs[3])||50;
    order.push({ci:i,init:dex*5+rollD10()});
  });
  var monDex=(monster.attrs&&monster.attrs[3])||50;
  order.push({ci:-1,init:monDex*5+rollD10(),isMonster:true,monster:monster});
  order.sort(function(a,b){return b.init-a.init;});

  combatState={
    monster:monster,
    cellKey:cellKey,
    detected:detected,
    order:order,
    round:1,
    step:0,
    ended:false
  };
  openCombat();
}

function rollD10(){return Math.floor(Math.random()*10)+1;}

function openCombat(){document.getElementById('combatOverlay').classList.add('open');renderCombat();}

function renderCombat(){
  if(!combatState) return;
  var {monster,order,round,step}=combatState;
  var logEl=document.getElementById('combatLog');
  var logs=recordLog.filter(function(r){return r.type==='combat';}).slice(-15);
  logEl.innerHTML=logs.length?logs.map(function(r){return '<div>['+r.time+'] '+escH(r.charName)+': '+escH(r.action)+'</div>';}).join(''):'<div style="color:var(--muted)">战斗开始...</div>';

  if(checkCombatEnd()) return;

  var body=document.getElementById('combatBody');
  if(step<order.length){
    var cur=order[step];
    if(cur.isMonster){
      body.innerHTML='<div style="color:var(--accent);margin-bottom:6px">第'+round+'轮 - '+escH(monster.name)+'的回合</div>'
        +'<div style="font-size:12px;margin-bottom:6px">怪物动作中...</div>';
      setTimeout(function(){doMonsterTurn();},800);
    }else{
      var ch=characters[cur.ci];
      var isDying=ch.hp<=0;
      var dyingClass=isDying?' <span class="ch-dying">(濒死)</span>':'';
      body.innerHTML='<div style="color:var(--accent);margin-bottom:6px">第'+round+'轮 - '+escH(ch.name)+'的回合'+dyingClass+'</div>'
        +'<div style="font-size:12px;margin-bottom:6px">怪物:'+escH(monster.name)+' HP:'+(monster.hp||'?')+'</div>'
        +'<div class="combat-opts" id="copts"></div>';
      renderCombatOpts(ch,cur.ci,isDying);
    }
  }else{
    combatState.round++;combatState.step=0;
    document.getElementById('combatBody').innerHTML='<div style="color:var(--accent)">第'+combatState.round+'轮开始</div>';
    setTimeout(function(){renderCombat();},1200);
  }
}

function checkCombatEnd(){
  var allDown=characters.every(function(ch){return ch.hp<=0;});
  if(allDown){
    endCombat('所有角色已濒死/死亡，战斗失败');
    return true;
  }
  if(combatState.monster.hp<=0){
    endCombat('怪物被击败，战斗胜利！');
    return true;
  }
  return false;
}

function endCombat(msg){
  addRec('战斗',msg,'combat');
  var logEl=document.getElementById('combatLog');
  logEl.innerHTML+='<div style="color:'+(msg.indexOf('胜利')>=0?'#4f4':'#e94560')+'">'+escH(msg)+'</div>';
  document.getElementById('combatOverlay').classList.remove('open');
  // 战斗结束后保留HP/MP/SAN变化（不重置）
  if(combatState.cellKey&&combatState.monster.hp<=0){
    delete mapState.cells[combatState.cellKey];
  }
  combatState=null;
  renderView();
  renderSlots();renderCharDisp();
}

function renderCombatOpts(ch,ci,isDying){
  var opts=document.getElementById('copts');
  var h='';

  if(isDying){
    h+='<div style="font-size:11px;color:var(--muted);margin-bottom:4px">此角色濒死，需要在其他角色的回合使用「急救」技能救援</div>';
  }else{
    // 攻击选项（使用战斗技能）
    if(ch.skills){
      ch.skills.forEach(function(sk,i){
        var nm=sk[0],v=(sk[1]||0)+(sk[2]||0);

          h+='<div class="c-opt" onclick="doCombatAttack('+ci+','+i+')"><div class="c-name">'+escH(nm)+'(攻击)</div><div class="c-dice">'+(sk[1]||0)+'/'+(sk[2]||0)+'%</div></div>';
        }
      });

    var v=sk?((sk[1]||0)+(sk[2]||0)):0;

    h+='<div class="c-opt" '+disabled+' onclick="doCombatOptSkill('+ci+',\''+nm+'\')"><div class="c-name">'+nm+(nm==='急救'&&isDying?'（对自己无效）':'' )+'</div><div class="c-dice">'+(v>0?v+'%':'无技能')+'</div></div>';

// 玩家用技能攻击
function doCombatAttack(ci,si){
  var ch=characters[ci];
  var sk=ch.skills[si];
  var v=(sk[1]||0)+(sk[2]||0);
  var d=roll100();
  var ok=d<=v;
  addRec(ch.name,sk[0]+'攻击: '+d+'/'+v+(ok?' 成功!':' 失败'),'combat');

  if(ok){
    // 找武器伤害骰
    var dmgDice='1d6';
    if(ch.items){
      var weapon=ch.items.find(function(it){return it.category==='weapon'&&it.dice;});
      if(weapon) dmgDice=weapon.dice;
    }
    var dmg=rollDiceStr(dmgDice);
    combatState.monster.hp=Math.max(0,combatState.monster.hp-dmg);
    addRec(ch.name,'对'+combatState.monster.name+'造成'+dmg+'点伤害(骰:'+dmgDice+')','combat');
    if(combatState.monster.hp<=0){
      addRec('战斗','怪物'+combatState.monster.name+'被击败!','combat');
    }
  }
  combatState.step++;
  setTimeout(function(){renderCombat();},600);
}

// 玩家用武器直接攻击
function doCombatWeaponAttack(ci,itemIdx){
  var ch=characters[ci];
  var it=ch.items[itemIdx];
  // 用对应战斗技能检定
  var skillName='格斗';
  if(it.name&&(it.name.indexOf('枪')>=0||it.name.indexOf('弓')>=0||it.name.indexOf('射击')>=0)) skillName='射击';
  var sk=ch.skills?ch.skills.find(function(s){return s[0].indexOf(skillName)>=0||s[0].indexOf('斗殴')>=0;}):null;
  var v=sk?((sk[1]||0)+(sk[2]||0)):30;
  var d=roll100();
  var ok=d<=v;
  addRec(ch.name,it.name+'('+skillName+'): '+d+'/'+v+(ok?' 命中!':' 未命中'),'combat');
  if(ok){
    var dmg=rollDiceStr(it.dice||'1d6');
    combatState.monster.hp=Math.max(0,combatState.monster.hp-dmg);
    addRec(ch.name,'造成'+dmg+'点伤害(骰:'+(it.dice||'1d6')+')','combat');
  }
  combatState.step++;
  setTimeout(function(){renderCombat();},600);
}

// 战斗中使用技能
function doCombatOptSkill(ci,skillName){
  var ch=characters[ci];
  var sk=ch.skills?ch.skills.find(function(s){return s[0]===skillName;}):null;
  var v=sk?((sk[1]||0)+(sk[2]||0)):0;
  var d=roll100();
  var ok=d<=v;
  addRec(ch.name,skillName+': '+d+'/'+v+(ok?' 成功':' 失败'),'combat');

  // 急救：成功后目标恢复1点HP（COC规则）
  if(skillName==='急救'&&ok){
    // 优先救自己（如果自己濒死），否则救队友
    var target=null;
    if(ch.hp<=0){
      target=ch;
    }else{
      target=characters.find(function(c){return c.hp<=0;});
    }
    if(target){
      target.hp=Math.min(target.hp+1,target.maxHp||10);
      addRec(ch.name,'对'+target.name+'使用急救，恢复1点HP，当前HP:'+target.hp,'combat');
      renderSlots();renderCharDisp();
    }
  }

  combatState.step++;
  setTimeout(function(){renderCombat();},600);
}

// 怪物回合AI
function doMonsterTurn(){
  if(!combatState) return;
  var mon=combatState.monster;
  if(!mon.attacks||!mon.attacks.length){
    addRec(mon.name,'怪物没有攻击方式，跳过回合','combat');
    combatState.step++;
    setTimeout(function(){renderCombat();},600);
    return;
  }
  // 用第一个攻击方式
  var atk=mon.attacks[0];
  var dmg=rollDiceStr(atk.dice||'1d6');
  // 选目标：随机打一个存活角色
  var alive=characters.filter(function(c){return c.hp>0;});
  if(!alive.length){
    combatState.step++;
    setTimeout(function(){renderCombat();},600);
    return;
  }
  var target=alive[Math.floor(Math.random()*alive.length)];
  target.hp=Math.max(0,target.hp-dmg);
  addRec(mon.name,'攻击'+target.name+'，造成'+dmg+'点伤害，'+target.name+'HP剩余:'+target.hp,'combat');
  if(target.hp<=0){
    addRec('战斗',target.name+'濒死!需要急救!','combat');
  }
  renderSlots();renderCharDisp();
  combatState.step++;
  setTimeout(function(){renderCombat();},600);
}

// ========== 掷骰系统 ==========
var diceCallback=null;
var diceResult=false;

function doDiceRoll(skillName,difficulty,callback){
  var pop=document.getElementById('diceOverlay');
  var title=document.getElementById('diceTitle');
  var area=document.getElementById('diceRollArea');
  var acts=document.getElementById('diceActs');
  title.textContent='掷骰:'+skillName;
  var d100=roll100();
  var pct=difficulty||50;
  var grade='',ok=false;
  if(d100<=5){grade='大成功';ok=true;}
  else if(d100>95){grade='大失败';ok=false;}
  else if(d100<=Math.floor(pct/5)){grade='极难成功';ok=true;}
  else if(d100<=Math.floor(pct/2)){grade='困难成功';ok=true;}
  else if(d100<=pct){grade='成功';ok=true;}
  else{grade='失败';}
  diceResult=ok;
  var gClass=d100<=5?'crit':(d100>95?'fumble':'');
  area.innerHTML='<div style="color:#888;font-size:11px">技能值:'+pct+'%</div>'
    +'<div class="dice-num'+(gClass?' '+gClass:'')+'">'+d100+'</div>'
    +'<div class="dice-grade'+(gClass?' '+gClass:'')+'">'+grade+'</div>';
  acts.innerHTML='';
  if(!ok&&d100<=95){
    var b=document.createElement('button');
    b.textContent='孤注一掷';
    b.onclick=function(){
      var d2=roll100();var o2=d2<=pct;
      diceResult=o2;
      area.innerHTML+='<div style="margin-top:6px;color:'+(o2?'#4f4':'#e94560')+'">孤注一掷:'+d2+(o2?' 成功!':' 失败(HP-1,SAN损失1d6)')+'</div>';
      if(!o2&&activeCharIdx>=0){
        characters[activeCharIdx].hp=Math.max(0,characters[activeCharIdx].hp-1);
        characters[activeCharIdx].san=Math.max(0,characters[activeCharIdx].san-rollD6());
        renderSlots();renderCharDisp();
      }
    };
    acts.appendChild(b);
  }
  // 口胡：技能/属性重试
  var _kc=activeCharIdx>=0?characters[activeCharIdx]:null;
  var _hasSkill=_kc&&_kc.skills&&_kc.skills.some(function(sk){return (sk[1]||0)||(sk[2]||0)||(sk[3]||0);});
  var _hasAttr=_kc&&_kc.attrs&&_kc.attrs.some(function(v){return v>0;});
  if(_kc&&(_hasSkill||_hasAttr)){
    var b=document.createElement('button');
    b.textContent='口胡(灵机一动)';
    b.style.background='#533483';
    b.onclick=function(){
        document.getElementById('diceRollArea').style.display='none';
        document.getElementById('diceActs').style.display='none';
        showKouhuPicker();
    };
    acts.appendChild(b);
  }
  if(activeCharIdx>=0){
    var ch=characters[activeCharIdx],lu=ch.luck||0;
    if(lu>0){
      var b=document.createElement('button');
      b.textContent='燃运(消耗幸运)';
      b.style.background='#b36200';
      b.onclick=function(){
        var use=Math.min(50,lu);
        ch.luck=Math.max(0,ch.luck-use);
        var d2=roll100();var o2=d2<=pct;
        diceResult=o2;
        area.innerHTML+='<div style="margin-top:6px;color:'+(o2?'#4f4':'#e94560')+'">燃运(消耗'+use+'幸运):'+d2+(o2?' 成功!':' 失败')+'</div>';
        renderCharDisp();
      };
      acts.appendChild(b);
    }
  }
  diceCallback=callback;
  pop.classList.add('open');
}

function closeDice(){
  if(diceCallback) diceCallback(diceResult);
  diceCallback=null;
  diceResult=false;
  document.getElementById('diceOverlay').classList.remove('open');
  // 恢复掷骰界面区域显示状态，防止口胡后残留 display:none
  document.getElementById('diceRollArea').style.display='';
  document.getElementById('diceActs').style.display='';
  // 清空口胡区域
  var kouhuArea=document.getElementById('diceKouhuArea');
  if(kouhuArea){kouhuArea.style.display='none';kouhuArea.innerHTML='';}
  interactiveKouhuCount=0; interactiveKouhuOK=0;
}

function roll100(){return Math.floor(Math.random()*100)+1;}
function rollD6(){return Math.floor(Math.random()*6)+1;}

// 解析掷骰字符串 如 "2d6+1", "1d4", "3d10+db"
function rollDiceStr(diceStr){
  if(!diceStr) return 1;
  var s=0;
  // 处理db
  var dbVal=0;
  if(activeCharIdx>=0&&characters[activeCharIdx].db){
    var db=characters[activeCharIdx].db;
    if(db.indexOf('+')>=0){dbVal=parseInt(db.replace('+',''))||0;}
    else if(db==='-1'||db==='-2'){dbVal=parseInt(db)||0;}
  }
  var ds=diceStr.replace(/db/gi,dbVal>=0?'+'+dbVal:'-'+Math.abs(dbVal));
  // 分割 + 和 -
  var parts=[];
  var current='';
  for(var i=0;i<ds.length;i++){
    if((ds[i]==='+'||ds[i]==='-')&&i>0){
      parts.push(current);
      current=ds[i];
    }else{
      current+=ds[i];
    }
  }
  parts.push(current);
  for(var i=0;i<parts.length;i++){
    var part=parts[i].trim();
    if(!part) continue;
    var sign=1;
    if(part[0]==='-'){sign=-1;part=part.slice(1);}
    else if(part[0]==='+'){part=part.slice(1);}
    if(part.indexOf('d')>=0){
      var [dCount,dSize]=part.split('d');
      var cnt=parseInt(dCount)||1;
      var sz=parseInt(dSize)||6;
      var sum=0;
      for(var j=0;j<cnt;j++) sum+=Math.floor(Math.random()*sz)+1;
      s+=sign*sum;
    }else{
      s+=sign*(parseInt(part)||0);
    }
  }
  return Math.max(1,s);
}

// ========== 角色管理 ==========
function renderSlots(){
  var cont=document.getElementById('charSlots');
  cont.innerHTML='';
  characters.forEach(function(ch,i){
    var d=document.createElement('div');
    d.className='ch-slot'+(activeCharIdx===i?' active':'');
    if(ch.hp<=0) d.className+=' dying';
    d.onclick=function(){selectChar(i);};
    var hpPct=Math.max(0,(ch.hp/ch.maxHp)*100);
    var mpPct=Math.max(0,(ch.mp/ch.maxMp)*100);
    var sanPct=Math.max(0,(ch.san/ch.maxSan)*100);
    d.innerHTML='<div class="s-name">'+(ch.name.substring?ch.name.substring(0,4):'?')+'</div>'
      +'<div class="s-bars"><div class="bar-w"><div class="bar-f bf-hp" style="width:'+hpPct+'%"></div></div>'
      +'<div class="s-bars"><div class="bar-w"><div class="bar-f bf-mp" style="width:'+mpPct+'%"></div></div>'
      +'<div class="s-bars"><div class="bar-w"><div class="bar-f bf-san" style="width:'+sanPct+'%"></div></div></div>';
    cont.appendChild(d);
  });
  if(characters.length<4){
    var d=document.createElement('div');
    d.className='ch-slot';d.onclick=openCharImport;
    d.innerHTML='<div class="s-empty">+</div><div class="s-name" style="color:var(--muted);font-size:9px">导入</div>';
    cont.appendChild(d);
  }
}

function selectChar(i){
  activeCharIdx=i;renderSlots();renderCharDisp();
}

  var d=document.getElementById('charDisplay');
  if(activeCharIdx<0){d.innerHTML='<div class="char-empty">点击下方角色槽<br>或点击"导入角色"按钮</div>';return;}

  var h='<div class="ch-card">';

  h+='<div class="ch-stat"><div class="ch-val ch-mp">'+(ch.mp||0)+'/'+(ch.maxMp||10)+'</div><div class="ch-lbl">MP</div></div>';
  h+='<div class="ch-stat"><div class="ch-val ch-san">'+(ch.san||0)+'/'+(ch.maxSan||50)+'</div><div class="ch-lbl">SAN</div></div>';
  h+='</div>';

    h+=an.map(function(n,i){
      var v=ch.attrs[i]||0;

  }

function openCharImport(){document.getElementById('charImportModal').style.display='flex';}
function closeCharImport(){document.getElementById('charImportModal').style.display='none';}

function doImportChar(){
  var raw=document.getElementById('charImportInput').value.trim();
  if(!raw){alert('请粘贴角色SEAB码');return;}
  try{
    var d=decodeSeab(raw);
    if(!d.v) throw new Error('非角色SEAB码');
    var ch={
      id:d.id||('ch_'+Date.now()),
      name:d.name||'未命名',
      playerName:d.playerName||'',
      attrs:d.a||[50,50,50,50,50,50,50,50],
      skills:d.sk||[],
      items:d.items||[],
      status:d.status||[],
      spells:d.spells||[],
      hp:(d.d&&d.d[0])||10,
      maxHp:(d.d&&d.d[0])||10,
      mp:(d.d&&d.d[1])||10,
      maxMp:(d.d&&d.d[1])||10,
      san:(d.d&&d.d[2])||50,
      maxSan:(d.d&&d.d[2])||50,
      luck:(d.d&&d.d[3])||50,
      db:d.db||'+0',build:d.build||0,mov:d.mov||8,credit:d.credit||0
    };
    characters.push(ch);
    closeCharImport();
    document.getElementById('charImportInput').value='';
    activeCharIdx=characters.length-1;
    renderSlots();renderCharDisp();
    addRec(ch.name,'角色卡已载入','system');
  }catch(e){alert('导入失败:'+e.message);}
}

function removeChar(i){
  if(!confirm('确定移除角色?')) return;
  addRec(characters[i].name,'角色被移除','system');
  characters.splice(i,1);
  if(activeCharIdx>=characters.length) activeCharIdx=characters.length-1;
  renderSlots();renderCharDisp();
}

function clickSkill(ci,si){
  var ch=characters[ci],sk=ch.skills[si];
  if(!sk) return;
  var val=(sk[1]||0)+(sk[2]||0);
  doDiceRoll(sk[0],val,function(ok){
    addRec(ch.name,sk[0]+'检定'+(ok?'成功':'失败'),'skill');
  });
}

// 基础属性点击掷骰（COC规则：1d100 ≤ 属性值 = 成功）
function clickAttr(ci,ai){
  var ch=characters[ci];
  if(!ch||!ch.attrs) return;
  var an=['STR','CON','SIZ','DEX','APP','INT','POW','EDU'];
  var attrName=an[ai]||('属性'+ai);
  var val=ch.attrs[ai]||0;
  doDiceRoll(attrName,val,function(ok){
    addRec(ch.name,attrName+'检定('+val+')'+(ok?'成功':'失败'),'skill');
  });
}

function addItemToChar(it){
  if(activeCharIdx<0) return;
  var ch=characters[activeCharIdx];
  if(!ch.items) ch.items=[];
  ch.items.push(JSON.parse(JSON.stringify(it)));
  renderCharDisp();renderSlots();
}

function getCharName(){
  if(activeCharIdx>=0&&activeCharIdx<characters.length) return characters[activeCharIdx].name;
  return'无人';
}

function updateViewInfo(){
  if(!playerPos){document.getElementById('viewInfo').textContent='未载入地图';return;}
  var dn=['北','东','南','西'];
  var s='位置:('+playerPos.r+','+playerPos.c+') 朝向:'+dn[playerPos.dir];
  if(mapState) s+=' | '+mapState.name;
  document.getElementById('viewInfo').textContent=s;
}

// ========== 记录系统 ==========
function addRec(charName,action,type){
  var now=new Date();
  var t=[now.getHours(),now.getMinutes(),now.getSeconds()].map(function(n){return(''+n).padStart(2,'0');}).join(':');
  recordLog.push({time:t,charName:charName,action:action,type:type||'action'});
  renderRecList();
}

function renderRecList(){
  var el=document.getElementById('recList');
  if(!recordLog.length){el.innerHTML='<div style="color:var(--muted);text-align:center;padding:16px">暂无记录</div>';return;}
  el.innerHTML=recordLog.map(function(r){
    return'<div class="rec-entry"><div class="rec-time">'+r.time+'</div><div class="rec-char">'+escH(r.charName)+'</div><div style="color:var(--text)">'+escH(r.action)+'</div></div>';
  }).join('');
  el.scrollTop=el.scrollHeight;
}

function toggleRecord(){
  document.getElementById('recordPanel').classList.toggle('open');
  renderRecList();
}

function exportRecord(){
  var txt='=== COC7 跑团记录 ===\n导出时间:'+new Date().toLocaleString()+'\n\n';
  recordLog.forEach(function(r){txt+='['+r.time+'] '+r.charName+': '+r.action+'\n';});
  var b=new Blob([txt],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='跑团记录_'+(new Date().toISOString().slice(0,10))+'.txt';a.click();
}

function clearRecord(){if(confirm('确定清空所有记录?')){recordLog=[];renderRecList();}}

// ========== 保存/导出 ==========
function saveChars(){
  if(!characters.length){alert('暂无角色');return;}
  var d={v:1,characters:characters,record:recordLog.slice(-50)};
  localStorage.setItem('coc7pl_chars',JSON.stringify(d));
  addRec('系统','角色数据已保存','system');
}

function exportChars(){
  if(!characters.length){alert('暂无角色');return;}
  var codes=characters.map(function(ch){
    return JSON.stringify({v:2,name:ch.name,playerName:ch.playerName,a:ch.attrs,sk:ch.skills,items:ch.items,status:ch.status,spells:ch.spells,
      d:[ch.maxHp,ch.maxMp,ch.maxSan,ch.luck],db:ch.db,build:ch.build,mov:ch.mov,credit:ch.credit});

// ========== 工具函数 ==========
function escH(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  if(s){var d=JSON.parse(s);if(d.characters&&d.characters.length){characters=d.characters;renderSlots();}}

// ========== 物品使用系统 ==========
function showItemUse(ci,itemIdx){
  if(!characters[ci]||!characters[ci].items[itemIdx]) return;
  var it=characters[ci].items[itemIdx];
  window._usingItem={ci:ci,idx:itemIdx,item:it};

  var info=document.getElementById('useItemInfo');
  info.innerHTML='<div style="font-size:13px;font-weight:600;color:var(--text)">'+escH(it.name)+'</div>'
    +(it.desc?'<div style="margin-top:4px;color:var(--muted)">'+escH(it.desc)+'</div>':'')
    +(it.category?'<div style="margin-top:4px;font-size:10px;color:var(--muted)">类别:'+escH(it.category)+'</div>':'');

  // 生成使用选项
  var opts=document.getElementById('useItemOpts');
  var h='';
  // 钥匙：尝试开门/开箱
  if(it.name&&(it.name.indexOf('钥匙')>=0||(it.tags&&it.tags.indexOf('钥匙')>=0))){
    h+='<button class="use-opt-btn" onclick="useKey()">使用钥匙开门/开箱</button>';
  }
  // 武器：可以进行攻击（在战斗中）
  if(it.category==='weapon'){
    h+='<button class="use-opt-btn" onclick="alert(\'请在战斗中使用武器攻击\')">使用武器</button>';
  }
  // 物品效果：使用
  if(it.effects&&it.effects.length>0){
    h+='<button class="use-opt-btn" onclick="applyItemEffects()">使用</button>';
  }
  // 通用：丢弃
  h+='<button class="use-opt-btn danger" onclick="dropItem()">丢弃</button>';

  opts.innerHTML=h;
  document.getElementById('itemUseModal').classList.add('open');
}

function useKey(){
  if(!window._usingItem) return;
  var {ci,item,idx}=window._usingItem;
  // 检查面对的是否是门或箱子
  var fc=getFacingCell();
  if(!fc||!fc.cell){alert('前方没有可使用的目标');return;}
  var cell=fc.cell;
  var keyId=item.id;

  // 开门
  if(fc.cell.type==='door'){
    if(String(cell.keyId)===String(keyId)||!cell.keyId){
      if(cell.open){alert('门已打开');return;}
      cell.open=true;
      addRec(characters[ci].name,'使用钥匙【'+item.name+'】打开了门','action');
      // 移除钥匙
      characters[ci].items.splice(idx,1);
      closeItemUse();
      renderCharDisp();renderSlots();renderView();
      return;
    }
  }
  // 开箱
  if(fc.cell.type==='chest'){
    closeItemUse();
    // 直接用当前钥匙尝试开箱
    if(!cell.keyId||String(cell.keyId)===String(keyId)){
      useKeyOnChest(fc.key,fc.cell,item);
    }else{
      // 钥匙不匹配，改为交互式开箱流程
      interactChest(fc.key,fc.cell);
    }
    return;
  }
  alert('此钥匙无法使用于当前目标');
}

function dropItem(){
  if(!window._usingItem) return;
  var {ci,idx}=window._usingItem;
  if(!confirm('确定丢弃【'+characters[ci].items[idx].name+'】？')) return;
  addRec(characters[ci].name,'丢弃了'+characters[ci].items[idx].name,'action');
  characters[ci].items.splice(idx,1);
  closeItemUse();
  renderCharDisp();renderSlots();
}

function applyItemEffects(){
  if(!window._usingItem) return;
  var {ci,idx,item}=window._usingItem; var it=item;
  var ch=characters[ci];
  if(!ch||!it.effects||!it.effects.length){alert('该物品没有效果');return;}
  var log=[];
  it.effects.forEach(function(e){
    var op=e.op, target=e.target;
    var val;
    if(op==='set'){
      var raw=e.dice||'0';
      if(/^\s*-?\d+\s*$/.test(raw)){
        val=parseInt(raw);
      }else{
        val=rollDiceStr(raw);
      }
    }else{
      val=rollDiceStr(e.dice||'0');
    }
    var applyVal=function(c,v,o,max){if(o==='add')return Math.min(c+v,(max||999));if(o==='sub')return Math.max(c-v,0);if(o==='set')return v;return c;};
    if(target==='HP'){ch.hp=applyVal(ch.hp,val,op,ch.maxHp);log.push('HP'+_opStr(op)+val);}
    else if(target==='MP'){ch.mp=applyVal(ch.mp,val,op,ch.maxMp);log.push('MP'+_opStr(op)+val);}
    else if(target==='SAN'){ch.san=applyVal(ch.san,val,op,ch.maxSan);log.push('SAN'+_opStr(op)+val);}
    else if(target==='幸运'){ch.luk=applyVal(ch.luk||50,val,op);log.push('幸运'+_opStr(op)+val);}
    else if(target==='STR'){ch.attrs[0]=applyVal(ch.attrs[0]||0,val,op);log.push('STR'+_opStr(op)+val);}
    else if(target==='CON'){ch.attrs[1]=applyVal(ch.attrs[1]||0,val,op);log.push('CON'+_opStr(op)+val);}
    else if(target==='SIZ'){ch.attrs[2]=applyVal(ch.attrs[2]||0,val,op);log.push('SIZ'+_opStr(op)+val);}
    else if(target==='DEX'){ch.attrs[3]=applyVal(ch.attrs[3]||0,val,op);log.push('DEX'+_opStr(op)+val);}
    else if(target==='APP'){ch.attrs[4]=applyVal(ch.attrs[4]||0,val,op);log.push('APP'+_opStr(op)+val);}
    else if(target==='INT'){ch.attrs[5]=applyVal(ch.attrs[5]||0,val,op);log.push('INT'+_opStr(op)+val);}
    else if(target==='POW'){ch.attrs[6]=applyVal(ch.attrs[6]||0,val,op);log.push('POW'+_opStr(op)+val);}
    else if(target==='EDU'){ch.attrs[7]=applyVal(ch.attrs[7]||0,val,op);log.push('EDU'+_opStr(op)+val);}
    else if(target==='STR+1d6'){var b=rollD6();ch.attrs[0]+=b;log.push('STR临时+'+b);}
    else if(target==='CON+1d6'){var b=rollD6();ch.attrs[1]+=b;log.push('CON临时+'+b);}
    else if(target==='宝物'){log.push('获得宝物！');}
  });
  addRec(ch.name,'使用【'+it.name+'】效果：'+log.join('，'),'action');
  if(it.counter !== undefined && it.counter > 0){
    it.counter--;
    if(it.counter<=0&&!it.indestructible){addRec(ch.name,it.name+' 已耗尽','action');characters[ci].items.splice(idx,1);idx=-1;}
  }
  closeItemUse();renderCharDisp();renderSlots();if(idx>=0)renderView();
}

function _opStr(o){return o==='add'?'+':o==='sub'?'-':'=';}

function closeItemUse(){
  document.getElementById('itemUseModal').classList.remove('open');
  window._usingItem=null;
}

// ========== 口胡：技能/属性重试（交互场景） ==========
var interactiveKouhuCount=0, interactiveKouhuOK=0;

function showKouhuPicker(){
  var ch=characters[activeCharIdx];
  if(!ch){alert('当前没有角色');return;}
  interactiveKouhuCount=0; interactiveKouhuOK=0;
  var area=document.getElementById('diceKouhuArea');
  var h='<div style="font-size:11px;color:var(--muted);margin-bottom:4px">选择技能进行灵机一动（需至少2个成功，最多选4个）:</div>';
  (ch.skills||[]).forEach(function(sk,i){
    if((sk[1]||0)||(sk[2]||0)) h+='<span class="kh-skill" onclick="doInteractiveKouhu(\'skill\','+i+',\''+escH(sk[0]).replace(/'/g,'\\\'')+'\','+((sk[1]||0)+(sk[2]||0))+')">'+escH(sk[0])+'</span>';
  });
  var attrNames=['STR','CON','SIZ','DEX','APP','INT','POW','EDU'];
  (ch.attrs||[]).forEach(function(val,i){
    if(!val) return;
    h+='<span class="kh-skill" onclick="doInteractiveKouhu(\'attr\','+i+',\''+attrNames[i]+'\','+val+')">'+attrNames[i]+':'+val+'</span>';
  });
  h+='<div id="kouhuCounter" style="margin-top:8px;font-size:10px;color:var(--muted)">已选0个，成功0个</div>';
  h+='<div style="margin-top:8px"><button onclick="cancelKouhu()" style="background:var(--bg3);color:var(--text);border:1px solid #3a3a5e;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:12px">取消</button></div>';
  area.innerHTML=h;
  area.style.display='block';
}

function doInteractiveKouhu(type,idx,name,value){
  var d=roll100();
  var ok=d<=value;
  interactiveKouhuCount++;
  if(ok) interactiveKouhuOK++;
  addRec(getCharName(),'灵机一动:'+name+'('+d+'/'+value+')'+(ok?' ✓':' ✗'),'action');
  var area=document.getElementById('diceKouhuArea');
  if(interactiveKouhuOK>=2){
    diceResult=true;
    area.innerHTML+='<div style="font-size:12px;color:#4f4;margin-top:6px">灵机一动成功！（已选'+interactiveKouhuCount+'个，成功'+interactiveKouhuOK+'个）</div>';
    setTimeout(function(){ closeDice(); },800);
  }else if(interactiveKouhuCount>=4){
    diceResult=false;
    area.innerHTML+='<div style="font-size:12px;color:#e94560;margin-top:6px">灵机一动失败（已选'+interactiveKouhuCount+'个，成功'+interactiveKouhuOK+'个）</div>';
    setTimeout(function(){ closeDice(); },800);
  }else{
    var counter=document.getElementById('kouhuCounter');
    if(counter){
      counter.textContent='已选'+interactiveKouhuCount+'个，成功'+interactiveKouhuOK+'个';
      counter.style.color=interactiveKouhuOK>=2?'#4f4':'var(--muted)';
    }
  }
}

function closeKouhuPicker(){
  var area=document.getElementById('diceKouhuArea');
  if(area) area.style.display='none';
  document.getElementById('diceRollArea').style.display='';
  document.getElementById('diceActs').style.display='';
  interactiveKouhuCount=0; interactiveKouhuOK=0;
}
function cancelKouhu(){
  diceResult=false;
  closeDice();
}
