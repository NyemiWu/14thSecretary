<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>内容后台 · 14thSecretary</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#0b0c0e;color:#a2a8b2;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  #loading{max-width:420px;padding:24px;line-height:1.9}
  #loading b{display:block;font-size:15px;color:#e6e4df;font-weight:500;letter-spacing:.16em;margin-bottom:10px}
  #loading p{font-size:13px;margin:0 0 6px}
  a{color:#d8b878}
</style>
</head>
<body>

<div id="loading">
  <b>正 在 加 载 内 容 后 台</b>
  <p>首次打开需要几秒。</p>
  <p>如果一直空白：确认网络能访问 unpkg.com，或者看 <a href="../buffer/cms/">配置说明</a>。</p>
</div>

<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

<script>
(function () {
  var timer = setInterval(function () {
    if (document.getElementById('nc-root')) {
      var el = document.getElementById('loading');
      if (el && el.parentNode) el.parentNode.removeChild(el);
      clearInterval(timer);
    }
  }, 120);
  setTimeout(function () { clearInterval(timer); }, 15000);
})();
</script>

</body>
</html>
