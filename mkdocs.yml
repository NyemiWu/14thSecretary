site_name: 14thSecretary
site_description: 文本分区 · 可交互叙事分区 · 缓冲分区
site_author: 14thSecretary

site_url: https://YOURNAME.github.io/14thSecretary/
repo_url: https://github.com/YOURNAME/14thSecretary
repo_name: YOURNAME/14thSecretary
edit_uri: edit/main/docs/

copyright: 14thSecretary · 内部资料

# 缓冲区分两级 —— 状态由稿件在哪个目录决定，不用额外字段：
#   pending/  待审（管理者还没标记）—— 只在 mkdocs serve 本地预览时构建，build 不发布
#   public/   公示中（管理者已标记通过）—— 正常构建，站上可见
#   公示期满 / 要求更改 → 直接从缓冲区删除，要改就重新提交
draft_docs: |
  buffer/pending/
not_in_nav: |
  buffer/public/**

theme:
  name: material
  language: zh
  logo: assets/sigil.svg
  favicon: assets/sigil.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YOURNAME/14thSecretary
      name: 14thSecretary on GitHub

nav:
  - 首页: index.md

  - 文本分区:
      - text/index.md
      - 设定:
          - text/canon/index.md
          - 秘语体系: text/canon/secrets.md
          - 四段式真名: text/canon/true-name.md
          - 赐名流程: text/canon/ritual.md
      - 图鉴:
          - text/bestiary/index.md
          - 001 灰烬中的某物: text/bestiary/001-ash.md
          - 002 静水之下: text/bestiary/002-stillwater.md
          - 003 第八次雷暴: text/bestiary/003-thunder.md
          - 004 巡礼者的残响: text/bestiary/004-pilgrim.md

  - 可交互叙事分区:
      - interactive/index.md
      - 工具:
          - interactive/tools/index.md
          - 测名台: interactive/tools/naming-demo.md

  - 缓冲分区:
      - buffer/index.md
      - 流程: buffer/rules.md
      - 编辑规范: buffer/style-guide.md
      - 条目模板: buffer/entries.md
