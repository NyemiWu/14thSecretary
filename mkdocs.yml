site_name: 14thSecretary
site_description: 文本分区 · 可交互叙事分区 · 缓冲分区
site_author: 14thSecretary

site_url: https://nyemiwu.github.io/14thSecretary/
repo_url: https://github.com/NyemiWu/14thSecretary
repo_name: NyemiWu/14thSecretary
edit_uri: edit/main/docs/

copyright: 14thSecretary · 内部资料

# 缓冲区分两级 —— 状态由稿件在哪个目录决定，不用额外字段：
#   pending/  待审（管理者还没标记）—— 只在 mkdocs serve 本地预览时构建，build 不发布
#   public/   公示中（管理者已标记通过）—— 正常构建，站上可见
#   公示期满 / 要求更改 → 直接从缓冲区删除，要改就重新提交
draft_docs: |
  buffer/pending/
not_in_nav: |
  buffer/public/**

theme:
  name: material
  language: zh
  logo: assets/sigil.svg
  favicon: assets/sigil.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

extra_css:
  - stylesheets/extra.css

# 注入「编辑此条目」按钮 —— 从 Material 生成的「编辑此页」链接里推出源文件路径，
# 指向站内内容后台而不是 GitHub 网页编辑器。见 docs/javascripts/edit-entry.js
extra_javascript:
  - javascripts/edit-entry.js

plugins:
  - search:
      lang:
        - zh
        - en
  - tags
  # 导航由各目录下的 .pages 文件驱动，新增文档不用改本文件
  - awesome-pages

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NyemiWu/14thSecretary
      name: 14thSecretary on GitHub

# ------------------------------------------------------------
# 导航不在这里维护。
# 每个目录下的 .pages 文件定义该层级的顺序与标题，新文档自动进导航。
# 顶层：docs/.pages   ·   文本分区：docs/text/.pages
# ------------------------------------------------------------
